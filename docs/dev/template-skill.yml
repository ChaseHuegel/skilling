# ==========================================
# SKILL CONFIGURATION TEMPLATE
# ==========================================
id: "mining"                      # Unique skill identifier (used in commands and DB)
max_level: 100                    # Maximum achievable level (default: 100)

# ----------------------------------------
# UI & VISUAL IDENTITY
# ----------------------------------------
display:
  name: "Mining"                 # Skill display name shown in the GUI
  icon: "minecraft:iron_pickaxe" # Material for the GUI icon
  custom_model_data: 1001       # Maps to the server's custom resource pack
  color: "GREEN"                # Spigot BossBar Color (GREEN, RED, BLUE, etc.)
  style: "SEGMENTED_10"         # Spigot BossBar Style
  # lore:                       # Optional descriptive lines for skill tooltip
  #   - "&7Master the art of mining."
  #   - "&7Current level: &a{level}&7/&a{max_level}"

# ----------------------------------------
# MATH & PROGRESSION
# ----------------------------------------
progression:
  curve: "polynomial"           # Evaluator type for the overall curve
  base_xp: 50                   # XP required for level 1
  exponent: 2.5                 # Exponent for the polynomial curve

# ----------------------------------------
# EXPERIENCE SOURCES
# ----------------------------------------
xp_sources:
  - trigger: "block_break"               # Event trigger key (block_break, entity_kill, craft_item, etc.)
    filters:
      - target: "#c:ores"                    # Uses the Tag Resolver
      - state: "player_placed:false"         # Checks the PDC anti-exploit flag
    reward:
      constant: 15.0                        # XP reward (constant evaluator)

  - trigger: "block_break"
    filters:
      - target: "minecraft:stone"
      - state: "player_placed:false"
    reward:
      constant: 2.0

# ----------------------------------------
# LEVEL-UP COMMANDS (Optional)
# Commands executed via console sender on every level-up.
# Supports placeholders: {player}, {level}, {skill_id}, {skill_name}
# ----------------------------------------
# level_up_commands:
#   - "give {player} minecraft:diamond 1"
#   - "eco give {player} 10"

# ----------------------------------------
# ABILITIES & MECHANICS
# ----------------------------------------
abilities:

  # -- ABILITY 1: The Core Passive (Linear Scaling) --
  - id: "geologist"              # Unique ability identifier
    display_name: "Geologist"    # Human-readable name (default: same as id)
    unlock_level: 1              # Level required to unlock (default: 1)
    trigger: "block_break"              # Required: the event that activates this ability (see docs for valid keys)

    display:
      # {yield_chance} is injected dynamically by the ParameterEvaluator during UI generation
      lore:
        - "&7Increases raw ore yield by &a{yield_chance}%&7."

    mechanics:                   # Mechanic actions executed when the trigger fires
      - type: "core:yield_multiplier"    # Mechanic registry key (see docs/capabilities.md)
        filters:
          - target: "#c:ores"
          - tool: "#minecraft:pickaxes"
        parameters:              # Evaluator parameters for the mechanic
          yield_chance:                        # Maps directly to the placeholder in the lore
            linear:
              base: 0.5                        # Value at unlock_level
              step: 0.5                        # Amount added per level
              max: 50.0                        # Hard clamp

    feedback:                    # Success feedback
      notify:
        action_bar: false                      # Suppress passive spam
        chat: false


  # -- ABILITY 2: The Gated Active (Requirements & Milestones) --
  - id: "vein_miner"              # Unique ability identifier
    display_name: "Vein Miner"    # Human-readable name (default: same as id)
    unlock_level: 15              # Level required to unlock (default: 1)
    trigger: "block_break"              # Required: the event that activates this ability (see docs for valid keys)

    display:
      # Lore convention for abilities with a requirements block: a "&7Costs" line
      # lists what the ability consumes (exhaustion hunger, "cost" items) and an
      # "&8Requires" line lists the activation conditions (states, held items,
      # cooldown, minimum hunger). Keep these lines in sync with requirements:.
      lore:
        - "&7Sneak-mine to break up to &a{chain_limit} &7connected ores."
        - "&7Costs 2 hunger + 1 coal."
        - "&8Requires: Sneaking, pickaxe, 5s cooldown, 3+ hunger."

    # Requirements must all return TRUE before mechanics execute
    requirements:
      cooldown: 5.0                     # Plain scalar = constant. Accepts evaluator syntax too:
      # cooldown:                        # Requirements.cooldown evaluator syntax for inverse sub-scaling:
      #   linear: { base: 5.0, step: -0.02, max: 1.0 }
      state:                             # Required player states (key:value list)
        - "is_sneaking"
        # - "equipped:heavy"            # Must be wearing full diamond/netherite armor
      items:                             # Item requirements (possession = must have, cost = consumed)
        - action: "possession"
          tag: "#minecraft:pickaxes"
          slot: "MAIN_HAND"
        - action: "cost"
          tag: "minecraft:coal"
          amount: 1                             # Example of consuming an item fuel source
      # Exhaustion (hunger) requirement — deducted on ability use
      # amount: hunger points to consume (0-20)
      # minimum: minimum hunger level required to activate
      exhaustion:
        amount: 2.0
        minimum: 3.0

    # Result Object Pattern feedback overrides
    on_failure:
      cooldown:                            # Feedback when the ability is on cooldown
        action_bar: "&cVein Miner cooling down: {time}s"
        sounds:
          - type: "BLOCK_NOTE_BLOCK_BASS"
            volume: 1.0
            pitch: 0.5
      missing_item:                        # Feedback when item requirements are not met
        action_bar: "&cRequires {amount}x {item} to power Vein Miner!"
      exhaustion:                          # Feedback when the player is too exhausted
        action_bar: "&cToo exhausted to mine!"
        sounds:
          - type: "ENTITY_PLAYER_BURP"
            volume: 0.5
            pitch: 0.5
            target: "self"

    mechanics:                   # Mechanic actions executed when the trigger fires
      - type: "core:chain_break"          # Mechanic registry key (see docs/capabilities.md)
        parameters:              # Evaluator parameters for the mechanic
          chain_limit:
            milestones:                        # O(log N) TreeMap lookup for tiered upgrades
              15: 3
              40: 8
              80: 16

    # -- STRING PARAMETERS --
    # Some mechanics take namespaced string constants (effect, attribute, material).
    # Use a quoted constant value; the raw string is passed through verbatim:
    # mechanics:
    #   - type: "core:apply_status"
    #     parameters:
    #       effect: { constant: "minecraft:poison" }
    #       duration: { constant: 3.0 }
    #       amplifier: { constant: 0.0 }

    # -- STABLE ATTRIBUTE MODIFIER UUID --
    # Attribute-modifier mechanics (speed_bonus, armor_bonus, knockback_resist,
    # modify_attack_speed, modify_jump, modify_attribute) accept an optional
    # "uuid" constant. Providing a stable UUID makes repeated activations replace
    # the previous modifier instead of stacking it. Omit it for a fresh random
    # modifier per activation (legacy behavior):
    # parameters:
    #   amount: { constant: 1.0 }
    #   duration: { constant: 8.0 }
    #   uuid: { constant: "3f2b9c4a-1e5d-4a6b-8c7d-9e0f1a2b3c4d" }

    # Executed strictly after successful requirements consumption
    feedback:
      notify:
        action_bar: true
        chat: false
        message: "&b✦ Vein Miner Activated! ✦"
      particles:
        - type: "BLOCK_CRACK"
          count: 15
          offset: [0.5, 0.5, 0.5]
          speed: 0.1
          target: "target"                     # Spawns at the block location
      sounds:
        - type: "ENTITY_ZOMBIE_BREAK_WOODEN_DOOR"
          volume: 0.5
          pitch: 1.2
          target: "self"                       # Plays at the player location
