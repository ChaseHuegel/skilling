id: "mining"
max_level: 100
display:
  name: "Mining"
  icon: "minecraft:iron_pickaxe"
  custom_model_data: 1001
  color: "GREEN"
  style: "SEGMENTED_10"
progression:
  curve: "polynomial"
  base_xp: 50
  exponent: 2.5
xp_sources:
  - trigger: "block_break"
    filters:
      - target: "#c:ores"
        state: "player_placed:false"
    reward:
      constant: 15
  - trigger: "block_break"
    filters:
      - target: "#c:stone"
        state: "player_placed:false"
    reward:
      constant: 5
abilities:
  - id: "geologist"
    display_name: "Geologist"
    unlock_level: 1
    display:
      lore:
        - "&7Increases raw ore yield by &a{yield_chance}%&7."
    requirements:
      cooldown: 0
      state: []
      items: []
    mechanics:
      - type: "core:yield_multiplier"
        filters:
          - target: "#c:ores"
          - tool: "#minecraft:pickaxes"
        parameters:
          yield_chance:
            linear:
              base: 0.5
              step: 0.5
              max: 50.0
    feedback:
      action_bar: false
      chat: false
      message: ""
      particles: []
      sounds: []
  - id: "vein_miner"
    display_name: "Vein Miner"
    unlock_level: 15
    display:
      lore:
        - "&7Mines up to &a{chain_limit} &7connected ores at once."
    requirements:
      cooldown: 5.0
      state:
        - "is_sneaking"
      items:
        - action: "cost"
          tag: "minecraft:coal"
          slot: "HAND"
          amount: 1
          item_cooldown: 0.0
    mechanics:
      - type: "core:chain_break"
        filters:
          - target: "#c:ores"
        parameters:
          chain_limit:
            milestones:
              15: 3
              40: 8
              80: 16
          exhaustion:
            constant: 2.0
    on_failure:
      cooldown:
        action_bar: "&cAbility on cooldown: &e{time}s remaining"
        sounds: []
      missing_state:
        action_bar: "&cYou must be sneaking to use Vein Miner"
        sounds: []
    feedback:
      action_bar: true
      chat: true
      message: "&a⚡ Vein Miner activated!"
      particles:
        - type: "BLOCK_DUST"
          count: 10
          target: "target"
          offset: [0.5, 0.5, 0.5]
          speed: 0.1
      sounds:
        - type: "BLOCK_STONE_BREAK"
          volume: 0.5
          pitch: 1.2
          target: "target"
