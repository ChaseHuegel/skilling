  # XP-tier split of #c:undead for the piety kill grind, so a scored reward
  # reflects each undead's effort (R weak ~= 40 vs R strong ~= 90). Kept disjoint
  # from each other so a single kill is never double-counted. Low-tier undead
  # come from the vanilla zombie/skeleton families written out explicitly,
  # because expanding #minecraft:zombies would drag zombified_piglin into both.
  undead_minor:
    - "minecraft:zombie"
