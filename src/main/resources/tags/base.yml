# ==========================================
# Skilling: Custom Tag Definitions
# ==========================================
# Define custom namespaced tag groups here.
# Tags use the prefix "c:" (custom) and can contain:
#   - Direct material names (e.g., "minecraft:diamond")
#   - Cross-references to vanilla tags (e.g., "#minecraft:logs")
#
# Usage in skill YAML: target: "#c:ores"
# ==========================================
#
# Entity tags (for the `target_type` state filter) use the same "c:" prefix
# under the `entity_tags:` key and hold entity type names (e.g.,
# "minecraft:zombie") and/or vanilla entity tag cross-references (e.g.,
# "#minecraft:zombies").
#
# Usage in skill YAML: state: "target_type:#c:undead"

custom_tags:
  # The "c:" prefix is automatically added by the loader.
  # Use keys matching what you write after "#c:" in skill YAML.
  ores:
    - "minecraft:coal_ore"
    - "minecraft:iron_ore"
    - "minecraft:gold_ore"
    - "minecraft:diamond_ore"
    - "minecraft:emerald_ore"
    - "minecraft:redstone_ore"
    - "minecraft:lapis_ore"
    - "minecraft:copper_ore"
    - "minecraft:deepslate_coal_ore"
    - "minecraft:deepslate_iron_ore"
    - "minecraft:deepslate_gold_ore"
    - "minecraft:deepslate_diamond_ore"
    - "minecraft:deepslate_emerald_ore"
    - "minecraft:deepslate_redstone_ore"
    - "minecraft:deepslate_lapis_ore"
    - "minecraft:deepslate_copper_ore"
    - "minecraft:nether_gold_ore"
    - "minecraft:nether_quartz_ore"

  logs:
    - "#minecraft:logs"

  gems:
    - "minecraft:diamond"
    - "minecraft:emerald"
    - "minecraft:amethyst_shard"

  stone:
    - "#minecraft:stone_crafting_materials"
    - "#minecraft:base_stone_overworld"
    - "#minecraft:base_stone_nether"

  excavatable:
    - "minecraft:dirt"
    - "minecraft:grass_block"
    - "minecraft:gravel"
    - "minecraft:sand"
    - "minecraft:sandstone"
    - "minecraft:red_sand"
    - "minecraft:red_sandstone"
    - "minecraft:clay"
    - "minecraft:soul_sand"
    - "minecraft:soul_soil"
    - "minecraft:podzol"
    - "minecraft:mycelium"
    - "minecraft:coarse_dirt"
    - "minecraft:rooted_dirt"

  # Archaeology blocks that hold brushable relic items. Used by the excavation
  # skill's brushing (player_interact) and digging (block_break) XP sources.
  suspicious_blocks:
    - "minecraft:suspicious_sand"
    - "minecraft:suspicious_gravel"

  veinminer:
    - "#c:stone"
    - "#c:ores"

  stone_products:
    - "#minecraft:stone_bricks"
    - "#minecraft:walls"
    - "#minecraft:slabs"
    - "#minecraft:stairs"
    - "minecraft:stone"
    - "minecraft:smooth_stone"
    - "minecraft:stone_bricks"
    - "minecraft:chiseled_stone_bricks"
    - "minecraft:cracked_stone_bricks"
    - "minecraft:mossy_stone_bricks"
    - "minecraft:stone_slab"
    - "minecraft:smooth_stone_slab"
    - "minecraft:cut_sandstone"
    - "minecraft:cut_red_sandstone"
    - "minecraft:terracotta"
    - "minecraft:glass"
    - "minecraft:glass_pane"

  # Redstone wiring and mechanism blocks, for the building skill's redstone
  # construction XP sources (craft and place). Powers only the act of building
  # contraptions, never raw BlockRedstoneEvent current (anti-grind, REPORT
  # SKILL-COVERAGE 3.2).
  redstone_components:
    - "minecraft:redstone"
    - "minecraft:redstone_torch"
    - "minecraft:repeater"
    - "minecraft:comparator"
    - "minecraft:piston"
    - "minecraft:sticky_piston"
    - "minecraft:observer"
    - "minecraft:hopper"
    - "minecraft:dispenser"
    - "minecraft:dropper"
    - "minecraft:redstone_lamp"
    - "minecraft:lever"
    - "minecraft:daylight_detector"
    - "minecraft:target"
    - "minecraft:note_block"
    - "minecraft:crafter"
    - "minecraft:tripwire_hook"
    - "minecraft:rail"
    - "minecraft:powered_rail"
    - "minecraft:detector_rail"
    - "minecraft:activator_rail"

  # The building skill's construction set: structural and redstone materials a
  # builder places, wires, and tears down. Deliberately excludes crafting
  # stations and valuable-material blocks (gold, diamond, emerald, beacons,
  # conduits) so the building skill's placement-refund and teardown scalars
  # never touch scarce or utility-only blocks.
  construction_blocks:
    - "#c:redstone_components"
    - "minecraft:scaffolding"
    - "minecraft:ladder"
    - "minecraft:iron_bars"
    - "minecraft:chain"
    - "minecraft:glass_pane"
    - "#minecraft:rails"
    - "#minecraft:wool"
    - "#minecraft:carpets"
    - "#minecraft:concrete"
    - "#minecraft:concrete_powder"

  # Blocks the building skill's demolition and dismantle abilities may break and
  # recover: the construction set plus the stone and plank build blocks (until
  # masonry and carpentry later claim their own craft loops).
  demolition_blocks:
    - "#c:construction_blocks"
    - "#c:stone_products"
    - "#minecraft:planks"

  # Item-form craft results for the building skill's construction crafting XP
  # source. Item-form tags are unambiguous when the filter matches a crafted
  # recipe result.
  construction_crafts:
    - "minecraft:scaffolding"
    - "minecraft:ladder"
    - "minecraft:chain"
    - "minecraft:iron_bars"
    - "minecraft:glass_pane"
    - "#minecraft:rails"
    - "#c:redstone_components"
    - "#c:explosives"

  # Explosive and propulsion materials, for the building skill's explosive craft
  # output (fuels the elytra-flight capstone's firework rockets).
  explosives:
    - "minecraft:gunpowder"
    - "minecraft:tnt"
    - "minecraft:firework_rocket"
    - "minecraft:firework_star"
    - "minecraft:fire_charge"

  herbs:
    - "#minecraft:flowers"
    - "minecraft:sugar_cane"
    - "minecraft:cactus"
    - "minecraft:vine"
    - "minecraft:kelp"
    - "minecraft:kelp_plant"
    - "minecraft:sea_pickle"
    - "minecraft:lily_pad"
    - "minecraft:brown_mushroom"
    - "minecraft:red_mushroom"
    - "minecraft:nether_wart"
    - "minecraft:crimson_fungus"
    - "minecraft:warped_fungus"
    - "minecraft:crimson_roots"
    - "minecraft:warped_roots"
    - "minecraft:twisting_vines"
    - "minecraft:weeping_vines"
    - "minecraft:glow_berries"
    - "minecraft:sweet_berries"

  heavy_weapons:
    - "minecraft:iron_sword"
    - "minecraft:diamond_sword"
    - "minecraft:netherite_sword"
    - "minecraft:iron_axe"
    - "minecraft:diamond_axe"
    - "minecraft:netherite_axe"
    - "minecraft:mace"

  light_weapons:
    - "minecraft:wooden_sword"
    - "minecraft:stone_sword"
    - "minecraft:golden_sword"
    - "minecraft:trident"

  # Any sword, axe, or mace. The dual-wield skill's both-hands weapon set.
  # Not a misc weapon: tridents are excluded by design.
  melee_weapons:
    - "#minecraft:swords"
    - "#minecraft:axes"
    - "minecraft:mace"

  tools:
    - "#minecraft:pickaxes"
    - "#minecraft:axes"
    - "#minecraft:shovels"
    - "#minecraft:hoes"
    - "#minecraft:swords"
    - "minecraft:bow"
    - "minecraft:crossbow"
    - "minecraft:trident"
    - "minecraft:mace"
    - "#minecraft:chest_armor"
    - "#minecraft:foot_armor"
    - "#minecraft:head_armor"
    - "#minecraft:leg_armor"

  leather_armor:
    - "minecraft:leather_helmet"
    - "minecraft:leather_chestplate"
    - "minecraft:leather_leggings"
    - "minecraft:leather_boots"

  # The full enchantable gear set in item form. Used by the enchanting skill's
  # Enchant Extraction requirement so only an actually-enchanted piece of gear in
  # the main hand qualifies. Enchanted books are deliberately excluded — they are
  # never a valid extraction source, which blocks a book-duplication loop.
  enchantable:
    - "#minecraft:swords"
    - "#minecraft:axes"
    - "#minecraft:pickaxes"
    - "#minecraft:shovels"
    - "#minecraft:hoes"
    - "minecraft:bow"
    - "minecraft:crossbow"
    - "minecraft:trident"
    - "minecraft:mace"
    - "#minecraft:head_armor"
    - "#minecraft:chest_armor"
    - "#minecraft:leg_armor"
    - "#minecraft:foot_armor"
    - "minecraft:shield"
    - "minecraft:fishing_rod"
    - "minecraft:elytra"

  # Armor tier tags drive the equipped_all / equipped_any state filters. They
  # reproduce the historical hard-coded tier sets as data, so armor gating is
  # fully configurable and no tier knowledge lives in Java.
  light_armor:
    - "#c:leather_armor"

  medium_armor:
    - "minecraft:chainmail_helmet"
    - "minecraft:chainmail_chestplate"
    - "minecraft:chainmail_leggings"
    - "minecraft:chainmail_boots"
    - "minecraft:iron_helmet"
    - "minecraft:iron_chestplate"
    - "minecraft:iron_leggings"
    - "minecraft:iron_boots"
    - "minecraft:golden_helmet"
    - "minecraft:golden_chestplate"
    - "minecraft:golden_leggings"
    - "minecraft:golden_boots"
    - "minecraft:turtle_helmet"

  heavy_armor:
    - "minecraft:diamond_helmet"
    - "minecraft:diamond_chestplate"
    - "minecraft:diamond_leggings"
    - "minecraft:diamond_boots"
    - "minecraft:netherite_helmet"
    - "minecraft:netherite_chestplate"
    - "minecraft:netherite_leggings"
    - "minecraft:netherite_boots"

  # Anything wearable in an armor slot that is not armor: empty (AIR) plus
  # helmet-slot headwear and the elytra. Used with equipped_all:#c:unarmored so
  # the unarmored skill grants XP when every slot is empty or holds such an item.
  unarmored:
    - "minecraft:air"
    - "minecraft:elytra"
    - "minecraft:carved_pumpkin"
    - "minecraft:jack_o_lantern"
    - "minecraft:skeleton_skull"
    - "minecraft:wither_skeleton_skull"
    - "minecraft:zombie_head"
    - "minecraft:player_head"
    - "minecraft:creeper_head"
    - "minecraft:dragon_head"
    - "minecraft:piglin_head"

  bows:
    - "minecraft:bow"
    - "minecraft:crossbow"

  instruments:
    - "minecraft:goat_horn"

  # All music discs in item form. Used to gate the bard's disc-into-jukebox XP
  # source and the free (no-cost) Stage Presence ability on the jukebox_play
  # trigger, so only an actual music disc inserted into a jukebox counts.
  music_discs:
    - "minecraft:music_disc_13"
    - "minecraft:music_disc_cat"
    - "minecraft:music_disc_blocks"
    - "minecraft:music_disc_chirp"
    - "minecraft:music_disc_far"
    - "minecraft:music_disc_mall"
    - "minecraft:music_disc_mellohi"
    - "minecraft:music_disc_stal"
    - "minecraft:music_disc_strad"
    - "minecraft:music_disc_ward"
    - "minecraft:music_disc_11"
    - "minecraft:music_disc_wait"
    - "minecraft:music_disc_otherside"
    - "minecraft:music_disc_pigstep"
    - "minecraft:music_disc_5"
    - "minecraft:music_disc_relic"
    - "minecraft:music_disc_creator"
    - "minecraft:music_disc_creator_music_box"
    - "minecraft:music_disc_precipice"
    - "minecraft:music_disc_tears"
    - "minecraft:music_disc_lava_chicken"

  # Signed written books (the item form, not book & quill). Used by the bard's
  # Lectern Story ability on the lectern_place trigger so only a completed
  # (signed) story placed on a lectern summons the party buff.
  written_books:
    - "minecraft:written_book"

  # Lectern blocks in item form, for craft/place XP targets where an item-form
  # tag is unambiguous (the vanilla tag is a block tag).
  lecterns:
    - "minecraft:lectern"


  fishing_rods:
    - "minecraft:fishing_rod"

  # XP-source design (REPORT_XP-SOURCE-DESIGN §5) material tags.
  holy_blocks:
    - "minecraft:beacon"
    - "minecraft:conduit"
    - "minecraft:lantern"
    - "minecraft:soul_lantern"
    - "minecraft:sea_lantern"
    - "minecraft:glowstone"
    - "minecraft:gold_block"
    - "#minecraft:candles"

  crops:
    - "#minecraft:crops"
    - "minecraft:sugar_cane"
    - "minecraft:melon"
    - "minecraft:pumpkin"
    - "minecraft:cocoa"

  # Edible raw crop items (the item forms a player eats, not the crop blocks).
  # #minecraft:crops is a block tag and never matches an eaten item, so
  # consume_item filters use this item-form tag instead.
  raw_crops:
    - "minecraft:carrot"
    - "minecraft:potato"
    - "minecraft:beetroot"
    - "minecraft:sweet_berries"
    - "minecraft:glow_berries"
    - "minecraft:melon_slice"

  # Vanilla tame foods. Used as the consumed "offering" cost for instant-tame
  # abilities, preserving the item-economy pillar: taming still costs an item.
  tame_offerings:
    - "minecraft:bone"
    - "minecraft:wheat_seeds"
    - "minecraft:pumpkin_seeds"
    - "minecraft:melon_seeds"
    - "minecraft:beetroot_seeds"
    - "minecraft:cod"
    - "minecraft:salmon"
    - "minecraft:golden_apple"
    - "minecraft:golden_carrot"

  # The broad edible set. Drives cooking XP (consume_item) and the Seasoning
  # identity: cooking owns every food in this tree.
  foods:
    - "minecraft:cooked_beef"
    - "minecraft:cooked_chicken"
    - "minecraft:cooked_porkchop"
    - "minecraft:cooked_mutton"
    - "minecraft:cooked_rabbit"
    - "minecraft:cooked_cod"
    - "minecraft:cooked_salmon"
    - "minecraft:baked_potato"
    - "minecraft:bread"
    - "minecraft:cookie"
    - "minecraft:cake"
    - "minecraft:pumpkin_pie"
    - "minecraft:mushroom_stew"
    - "minecraft:rabbit_stew"
    - "minecraft:beetroot_soup"
    - "minecraft:dried_kelp"
    - "minecraft:golden_carrot"
    - "minecraft:honey_bottle"
    - "minecraft:apple"
    - "minecraft:melon_slice"
    - "minecraft:sweet_berries"
    - "minecraft:glow_berries"
    - "minecraft:carrot"
    - "minecraft:potato"
    - "minecraft:beetroot"

  # Foods produced by smelting (furnace / smoker / blast furnace). The primary
  # cooking grind and the Heat Control (L15 furnace output) target.
  smelted_foods:
    - "minecraft:cooked_beef"
    - "minecraft:cooked_chicken"
    - "minecraft:cooked_porkchop"
    - "minecraft:cooked_mutton"
    - "minecraft:cooked_rabbit"
    - "minecraft:cooked_cod"
    - "minecraft:cooked_salmon"
    - "minecraft:baked_potato"
    - "minecraft:dried_kelp"

  # Foods produced by crafting (not smelting). Batch Cooking (L50 craft output)
  # and the crafted-food XP source target.
  crafted_foods:
    - "minecraft:bread"
    - "minecraft:cookie"
    - "minecraft:cake"
    - "minecraft:pumpkin_pie"
    - "minecraft:mushroom_stew"
    - "minecraft:rabbit_stew"
    - "minecraft:beetroot_soup"

  # The Balanced Diet (L25) variety categories. Kept disjoint so one bite fires
  # exactly one meal aura and the player never gets two at once.
  cooked_meats:
    - "minecraft:cooked_beef"
    - "minecraft:cooked_chicken"
    - "minecraft:cooked_porkchop"
    - "minecraft:cooked_mutton"
    - "minecraft:cooked_rabbit"

  cooked_fish:
    - "minecraft:cooked_cod"
    - "minecraft:cooked_salmon"

  baked_goods:
    - "minecraft:bread"
    - "minecraft:cookie"
    - "minecraft:cake"
    - "minecraft:pumpkin_pie"
    - "minecraft:baked_potato"

  veggies_sweets:
    - "minecraft:apple"
    - "minecraft:melon_slice"
    - "minecraft:sweet_berries"
    - "minecraft:glow_berries"
    - "minecraft:carrot"
    - "minecraft:potato"
    - "minecraft:beetroot"

  soups:
    - "minecraft:mushroom_stew"
    - "minecraft:rabbit_stew"
    - "minecraft:beetroot_soup"

  # Premium gilded fare. Golden apple is excluded: it is already strong and
  # widely carried, so Gilded Fare (L75) elevates the other premium foods.
  golden_foods:
    - "minecraft:golden_carrot"
    - "minecraft:honey_bottle"

  # The celebration cake, target of the L100 capstone's block_place check.
  cakes:
    - "minecraft:cake"

  # Raw foods that cook on a campfire (the vanilla campfire recipes). Used by
  # the survival skill's campfire-cooking XP source, which rewards placing the
  # item on a lit campfire.
  campfire_foods:
    - "minecraft:beef"
    - "minecraft:chicken"
    - "minecraft:porkchop"
    - "minecraft:mutton"
    - "minecraft:rabbit"
    - "minecraft:cod"
    - "minecraft:salmon"
    - "minecraft:potato"
    - "minecraft:kelp"

  # Campfire blocks in item form, for craft_item target filters. The vanilla
  # #minecraft:campfires tag is a block tag; this item-form tag is unambiguous
  # when matching a crafted recipe result.
  campfires:
    - "minecraft:campfire"
    - "minecraft:soul_campfire"

  potions:
    - "minecraft:potion"
    - "minecraft:splash_potion"
    - "minecraft:lingering_potion"
    - "minecraft:honey_bottle"

  shields:
    - "minecraft:shield"

  # The full woodworker product set: every timber-derived craft. Used by the
  # carpentry skill's craft/place abilities. Deliberately broad so a single
  # "all my wooden products" filter reads naturally.
  wooden_products:
    - "#minecraft:planks"
    - "#minecraft:wooden_slabs"
    - "#minecraft:wooden_stairs"
    - "#minecraft:fences"
    - "#minecraft:fence_gates"
    - "#minecraft:wooden_doors"
    - "#minecraft:wooden_trapdoors"
    - "#minecraft:wooden_buttons"
    - "#minecraft:wooden_pressure_plates"
    - "#minecraft:signs"
    - "#minecraft:boats"
    - "minecraft:ladder"
    - "minecraft:chest"
    - "minecraft:barrel"
    - "minecraft:crafting_table"
    - "minecraft:cartography_table"
    - "minecraft:fletching_table"
    - "minecraft:bookshelf"
    - "minecraft:composter"

  # The premium woodworker line: every wooden product EXCEPT raw planks. The
  # carpentry XP sources price planks separately (a cheap, spammable grind gets
  # a low return) while this tag prices the higher-value joined products, so the
  # two never double-count the same craft.
  carpentry_joinery:
    - "#minecraft:wooden_slabs"
    - "#minecraft:wooden_stairs"
    - "#minecraft:fences"
    - "#minecraft:fence_gates"
    - "#minecraft:wooden_doors"
    - "#minecraft:wooden_trapdoors"
    - "#minecraft:wooden_buttons"
    - "#minecraft:wooden_pressure_plates"
    - "#minecraft:signs"
    - "#minecraft:boats"
    - "minecraft:ladder"
    - "minecraft:chest"
    - "minecraft:barrel"
    - "minecraft:crafting_table"
    - "minecraft:cartography_table"
    - "minecraft:fletching_table"
    - "minecraft:bookshelf"
    - "minecraft:composter"

  shovels:
    - "#minecraft:shovels"

  # Cauldron blocks in block form, used by the alchemy skill's transmutation
  # (right_click_block target filter). Java cauldrons hold water/lava/powder
  # snow but never potions, so the alchemy acts use the cauldron purely as a
  # reaction vessel.
  cauldrons:
    - "minecraft:cauldron"
    - "minecraft:water_cauldron"
    - "minecraft:lava_cauldron"
    - "minecraft:powder_snow_cauldron"

  # Brewing-ingredient flora harvested for alchemy XP. Kept distinct from #c:herbs
  # so the herbalism skill does not double-claim nether wart as its own source.
  potion_flora:
    - "minecraft:nether_wart"
    - "minecraft:glowstone"

  # Blocks the stealth skill's Silent Steps suppresses while sneaking: wooden
  # and stone pressure plates plus the two weighted plates. Tripwires ride the
  # same physical-interaction trigger and join via #c:trip_traps.
  pressure_plates:
    - "#minecraft:wooden_pressure_plates"
    - "#minecraft:stone_pressure_plates"
    - "minecraft:heavy_weighted_pressure_plate"
    - "minecraft:light_weighted_pressure_plate"

  # Sculpt blocks the stealth skill suppresses: sensors and the shrieker. They
  # receive vibrations through the cancellable BlockReceiveGameEvent (sensed /
  # trip_trap triggers).
  sculk_sensors:
    - "minecraft:sculk_sensor"
    - "minecraft:calibrated_sculk_sensor"
    - "minecraft:sculk_shrieker"

  # The complete silent-travel trap set: every pressure plate, tripwire and
  # tripwire hook, and sculpt sensor. Used by the single Silent Steps ability
  # (core:cancel_event on the trip_trap trigger) so one entry covers all of them.
  trip_traps:
    - "minecraft:oak_pressure_plate"
    - "minecraft:spruce_pressure_plate"
    - "minecraft:birch_pressure_plate"
    - "minecraft:jungle_pressure_plate"
    - "minecraft:acacia_pressure_plate"
    - "minecraft:dark_oak_pressure_plate"
    - "minecraft:mangrove_pressure_plate"
    - "minecraft:cherry_pressure_plate"
    - "minecraft:bamboo_pressure_plate"
    - "minecraft:crimson_pressure_plate"
    - "minecraft:warped_pressure_plate"
    - "minecraft:stone_pressure_plate"
    - "minecraft:heavy_weighted_pressure_plate"
    - "minecraft:light_weighted_pressure_plate"
    - "minecraft:tripwire"
    - "minecraft:tripwire_hook"
    - "minecraft:sculk_sensor"
    - "minecraft:calibrated_sculk_sensor"
    - "minecraft:sculk_shrieker"

# Entity-type tags, resolved via the `target_type` state filter. Values are
# entity type names and/or vanilla entity tag cross-references.
entity_tags:
  undead:
    - "#minecraft:zombies"
    - "#minecraft:skeletons"
    - "minecraft:wither_skeleton"
    - "minecraft:phantom"
    - "minecraft:zombified_piglin"
    - "minecraft:drowned"
    - "minecraft:stray"
    - "minecraft:husk"

  # Mobs the husbandry skill's Mob Porter can carry on the player's shoulders.
  # A permissive, curated default: villagers, farm animals, and neutral pets.
  # Server owners edit this tag (or add their own target_type filter) to allow
  # hostile mobs or to restrict what can be picked up.
  portable_mobs:
    - "minecraft:villager"
    - "minecraft:cow"
    - "minecraft:pig"
    - "minecraft:sheep"
    - "minecraft:chicken"
    - "minecraft:rabbit"
    - "minecraft:goat"
    - "minecraft:horse"
    - "minecraft:donkey"
    - "minecraft:mule"
    - "minecraft:cat"
    - "minecraft:wolf"
    - "minecraft:fox"
    - "minecraft:panda"
    - "minecraft:bee"
    - "minecraft:axolotl"
    - "minecraft:armadillo"

  # Pickpocket loot groups. The ability (L50 Pickpocket) is gated on the union
  # #c:humanoid, and each core:drop_loot mechanic filters one disjoint group so
  # exactly one table rolls per target. Nothing leaves a player's own inventory;
