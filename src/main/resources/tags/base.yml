# ==========================================
# Skilling: Custom Tag Definitions
# ==========================================
# Define custom namespaced tag groups here.
# Tags use the prefix "c:" (custom) and can contain:
#   - Direct material names (e.g., "minecraft:diamond")
#   - Cross-references to vanilla tags (e.g., "#minecraft:logs")
#
# Usage in skill YAML: target: "#c:ores"
# ==========================================
#
# Entity tags (for the `target_type` state filter) use the same "c:" prefix
# under the `entity_tags:` key and hold entity type names (e.g.,
# "minecraft:zombie") and/or vanilla entity tag cross-references (e.g.,
# "#minecraft:zombies").
#
# Usage in skill YAML: state: "target_type:#c:undead"

custom_tags:
  # The "c:" prefix is automatically added by the loader.
  # Use keys matching what you write after "#c:" in skill YAML.
  ores:
    - "minecraft:coal_ore"
    - "minecraft:iron_ore"
    - "minecraft:gold_ore"
    - "minecraft:diamond_ore"
    - "minecraft:emerald_ore"
    - "minecraft:redstone_ore"
    - "minecraft:lapis_ore"
    - "minecraft:copper_ore"
    - "minecraft:deepslate_coal_ore"
    - "minecraft:deepslate_iron_ore"
    - "minecraft:deepslate_gold_ore"
    - "minecraft:deepslate_diamond_ore"
    - "minecraft:deepslate_emerald_ore"
    - "minecraft:deepslate_redstone_ore"
    - "minecraft:deepslate_lapis_ore"
    - "minecraft:deepslate_copper_ore"
    - "minecraft:nether_gold_ore"
    - "minecraft:nether_quartz_ore"

  logs:
    - "#minecraft:logs"

  gems:
    - "minecraft:diamond"
    - "minecraft:emerald"
    - "minecraft:amethyst_shard"

  # The mining skill's common tier: plentiful, cheap-to-break overworld rock.
  # Deliberately listed explicitly (not via #minecraft:base_stone_overworld) so
  # the tier stays disjoint from the deeper/precious tiers below and each block
  # awards exactly one XP source.
  stone:
    - "minecraft:stone"
    - "minecraft:cobblestone"
    - "minecraft:granite"
    - "minecraft:diorite"
    - "minecraft:andesite"
    - "minecraft:sandstone"
    - "minecraft:red_sandstone"
    - "minecraft:smooth_sandstone"
    - "minecraft:smooth_red_sandstone"
    - "minecraft:cut_sandstone"
    - "minecraft:cut_red_sandstone"
    - "minecraft:chiseled_sandstone"
    - "minecraft:chiseled_red_sandstone"

  # The mining skill's mid tier: deeper or nether-floor rock that digs slower
  # than common stone, so it pays a moderate premium.
  deep_mine:
    - "minecraft:deepslate"
    - "minecraft:cobbled_deepslate"
    - "minecraft:tuff"
    - "minecraft:netherrack"
    - "minecraft:basalt"
    - "minecraft:polished_basalt"
    - "minecraft:blackstone"
    - "minecraft:gilded_blackstone"
    - "minecraft:calcite"
    - "minecraft:dripstone_block"
    - "minecraft:end_stone"
    - "minecraft:magma_block"

  # The mining skill's precious tier: hard, scarce, or high-value blocks
  # (obsidian, amethyst) that mine slowly and pay the highest stone premium.
  precious_mine:
    - "minecraft:obsidian"
    - "minecraft:crying_obsidian"
    - "minecraft:amethyst_block"
    - "minecraft:budding_amethyst"
    - "minecraft:amethyst_cluster"
    - "minecraft:small_amethyst_bud"
    - "minecraft:medium_amethyst_bud"
    - "minecraft:large_amethyst_bud"

  # The union of every block the mining skill's Blast Harvest (L50) rescues the
  # raw drops of. Covering all four tiers lets an explosives miner harvest any
  # natural rock or ore with TNT.
  mineables:
    - "#c:stone"
    - "#c:deep_mine"
    - "#c:precious_mine"
    - "#c:ores"

  excavatable:
    - "minecraft:dirt"
    - "minecraft:grass_block"
    - "minecraft:gravel"
    - "minecraft:sand"
    - "minecraft:sandstone"
    - "minecraft:red_sand"
    - "minecraft:red_sandstone"
    - "minecraft:clay"
    - "minecraft:soul_sand"
    - "minecraft:soul_soil"
    - "minecraft:podzol"
    - "minecraft:mycelium"
    - "minecraft:coarse_dirt"
    - "minecraft:rooted_dirt"

  # Archaeology blocks that hold brushable relic items. Used by the excavation
  # skill's brushing (player_interact) and digging (block_break) XP sources.
  suspicious_blocks:
    - "minecraft:suspicious_sand"
    - "minecraft:suspicious_gravel"

  veinminer:
    - "#c:stone"
    - "#c:deep_mine"
    - "#c:ores"

  stone_products:
    - "#minecraft:stone_bricks"
    - "#minecraft:walls"
    - "#minecraft:slabs"
    - "#minecraft:stairs"
    - "minecraft:stone"
    - "minecraft:smooth_stone"
    - "minecraft:stone_bricks"
    - "minecraft:chiseled_stone_bricks"
    - "minecraft:cracked_stone_bricks"
    - "minecraft:mossy_stone_bricks"
    - "minecraft:stone_slab"
    - "minecraft:smooth_stone_slab"
    - "minecraft:cut_sandstone"
    - "minecraft:cut_red_sandstone"
    - "minecraft:terracotta"
    - "minecraft:glass"
    - "minecraft:glass_pane"

  # ----------------------------------------
  # MASONRY SKILL TAGS
  # ----------------------------------------
  # Raw earth blocks the masonry skill gathers for clay. Kept to the truly
  # clay-forming sources so digging mud or clay is a real foraging loop and is
  # time-gated by travel (clay sits by water, mud in lush/mangrove biomes).
  clay_sources:
    - "minecraft:clay"
    - "minecraft:mud"

  # The kiln's fired products, in item form (the furnace_extract target). The
  # raw clay/sand/stone feed enters a furnace and comes out here, so this is the
  # kiln grind that drives the masonry XP loop and the L1 Firing output scalar.
  fired_products:
    - "minecraft:stone"
    - "minecraft:smooth_stone"
    - "minecraft:terracotta"
    - "minecraft:glass"
    - "minecraft:brick"
    - "minecraft:nether_brick"

  # Reaction vessels for the masonry Kiln Fire (L25), in block form. These let a
  # right-click transmute fire raw clay/sand instantly rather than running the
  # furnace. Kept disjoint from alchemy's cauldrons (its own reaction topic).
  furnaces:
    - "minecraft:furnace"
    - "minecraft:blast_furnace"
    - "minecraft:smoker"

  # The masonry craft-products loop: item-form recipes a mason turns raw fired
  # and sculpted stone into. Deliberately disjoint from building's
  # construction_crafts (scaffolding/redstone/explosives) so a single craft
  # never double-awards two skills. Stone-brick decorative variants live here
  # because a mason makes them; building's placement sets own where they go down.
  masonry_craft:
    - "minecraft:bricks"
    - "minecraft:mud_bricks"
    - "minecraft:nether_bricks"
    - "minecraft:stone_bricks"
    - "minecraft:chiseled_stone_bricks"
    - "minecraft:cracked_stone_bricks"
    - "minecraft:mossy_stone_bricks"
    - "minecraft:stone_brick_slab"
    - "minecraft:stone_brick_stairs"
    - "minecraft:stone_brick_wall"
    - "minecraft:quartz_block"
    - "minecraft:smooth_quartz"
    - "minecraft:quartz_pillar"
    - "minecraft:chiseled_quartz_block"
    - "minecraft:quartz_bricks"
    - "minecraft:blackstone"
    - "minecraft:polished_blackstone"
    - "minecraft:polished_blackstone_bricks"
    - "minecraft:chiseled_polished_blackstone"

  # Cheap-bulk concrete powder recipes, priced as a low-return craft source. Each
  # of the sixteen colors is a flat mixing craft (sand + gravel + dye), so this
  # is the spammable low-value grind in the masonry XP loop.
  concrete_powder:
    - "minecraft:white_concrete_powder"
    - "minecraft:orange_concrete_powder"
    - "minecraft:magenta_concrete_powder"
    - "minecraft:light_blue_concrete_powder"
    - "minecraft:yellow_concrete_powder"
    - "minecraft:lime_concrete_powder"
    - "minecraft:pink_concrete_powder"
    - "minecraft:gray_concrete_powder"
    - "minecraft:light_gray_concrete_powder"
    - "minecraft:cyan_concrete_powder"
    - "minecraft:purple_concrete_powder"
    - "minecraft:blue_concrete_powder"
    - "minecraft:brown_concrete_powder"
    - "minecraft:green_concrete_powder"
    - "minecraft:red_concrete_powder"
    - "minecraft:black_concrete_powder"

  # The masonry placement loop, kept disjoint from building's sets. Placement
  # goals exclude concrete (construction_blocks), terracotta and plain glass and
  # stone-bricks (stone_products) so no single placement double-awards building
  # and masonry. What is left is the fired and sculpted earth palette building
  # does not already claim: brick, mud, nether, prismarine, quartz, blackstone.
  masonry_placed:
    - "minecraft:bricks"
    - "minecraft:mud_bricks"
    - "minecraft:nether_bricks"
    - "minecraft:prismarine"
    - "minecraft:prismarine_bricks"
    - "minecraft:dark_prismarine"
    - "minecraft:prismarine_slab"
    - "minecraft:prismarine_stairs"
    - "minecraft:quartz_block"
    - "minecraft:smooth_quartz"
    - "minecraft:quartz_pillar"
    - "minecraft:chiseled_quartz_block"
    - "minecraft:quartz_bricks"
    - "minecraft:blackstone"
    - "minecraft:polished_blackstone"
    - "minecraft:polished_blackstone_bricks"
    - "minecraft:chiseled_polished_blackstone"

  # Redstone wiring and mechanism blocks, for the building skill's redstone
  # construction XP sources (craft and place). Powers only the act of building
  # contraptions, never raw BlockRedstoneEvent current (anti-grind, REPORT
  # SKILL-COVERAGE 3.2).
  redstone_components:
    - "minecraft:redstone"
    - "minecraft:redstone_torch"
    - "minecraft:repeater"
    - "minecraft:comparator"
    - "minecraft:piston"
    - "minecraft:sticky_piston"
    - "minecraft:observer"
    - "minecraft:hopper"
    - "minecraft:dispenser"
    - "minecraft:dropper"
    - "minecraft:redstone_lamp"
    - "minecraft:lever"
    - "minecraft:daylight_detector"
    - "minecraft:target"
    - "minecraft:note_block"
    - "minecraft:crafter"
    - "minecraft:tripwire_hook"
    - "minecraft:rail"
    - "minecraft:powered_rail"
    - "minecraft:detector_rail"
    - "minecraft:activator_rail"

  # The building skill's construction set: structural and redstone materials a
  # builder places, wires, and tears down. Deliberately excludes crafting
  # stations and valuable-material blocks (gold, diamond, emerald, beacons,
  # conduits) so the building skill's placement-refund and teardown scalars
  # never touch scarce or utility-only blocks.
  construction_blocks:
    - "#c:redstone_components"
    - "minecraft:scaffolding"
    - "minecraft:ladder"
    - "minecraft:iron_bars"
    - "minecraft:chain"
    - "minecraft:glass_pane"
    - "#minecraft:rails"
    - "#minecraft:wool"
    - "#minecraft:carpets"
    - "#minecraft:concrete"
    - "#minecraft:concrete_powder"

  # Blocks the building skill's demolition and dismantle abilities may break and
  # recover: the construction set plus the stone and plank build blocks (until
  # masonry and carpentry later claim their own craft loops).
  demolition_blocks:
    - "#c:construction_blocks"
    - "#c:stone_products"
    - "#minecraft:planks"

  # Item-form craft results for the building skill's construction crafting XP
  # source. Item-form tags are unambiguous when the filter matches a crafted
  # recipe result.
  construction_crafts:
    - "minecraft:scaffolding"
    - "minecraft:ladder"
    - "minecraft:chain"
    - "minecraft:iron_bars"
    - "minecraft:glass_pane"
    - "#minecraft:rails"
    - "#c:redstone_components"
    - "#c:explosives"

  # Explosive and propulsion materials, for the building skill's explosive craft
  # output (fuels the elytra-flight capstone's firework rockets).
  explosives:
    - "minecraft:gunpowder"
    - "minecraft:tnt"
    - "minecraft:firework_rocket"
    - "minecraft:firework_star"
    - "minecraft:fire_charge"

  herbs:
    - "#minecraft:flowers"
    - "minecraft:sugar_cane"
    - "minecraft:cactus"
    - "minecraft:vine"
    - "minecraft:kelp"
    - "minecraft:kelp_plant"
    - "minecraft:sea_pickle"
    - "minecraft:lily_pad"
    - "minecraft:brown_mushroom"
    - "minecraft:red_mushroom"
    - "minecraft:crimson_fungus"
    - "minecraft:warped_fungus"
    - "minecraft:crimson_roots"
    - "minecraft:warped_roots"
    - "minecraft:twisting_vines"
    - "minecraft:weeping_vines"
    - "minecraft:glow_berries"
    - "minecraft:sweet_berries"

  # The scarcer, higher-value wild finds. A subset of #c:herbs whose breaks pay a
  # premium reward (herbalism XP) and roll the rare forage loot table. Nether wart
  # is deliberately absent — it is Alchemy's potion flora, not a wild herb find.
  rare_herbs:
    - "minecraft:brown_mushroom"
    - "minecraft:red_mushroom"
    - "minecraft:crimson_fungus"
    - "minecraft:warped_fungus"
    - "minecraft:crimson_roots"
    - "minecraft:warped_roots"
    - "minecraft:cactus"
    - "minecraft:sweet_berries"
    - "minecraft:glow_berries"
    - "minecraft:lily_pad"
    - "minecraft:sea_pickle"

  # Item-form herb-derived products for the herbalism craft/place sources. These
  # are the results a forager turns wild flora into, so the craft loop is a
  # cheap-bulk grind at low XP return.
  herb_products:
    - "minecraft:paper"
    - "minecraft:sugar"
    - "minecraft:green_dye"
    - "minecraft:bone_meal"
    - "minecraft:red_dye"
    - "minecraft:yellow_dye"
    - "minecraft:light_blue_dye"
    - "minecraft:pink_dye"
    - "minecraft:orange_dye"
    - "minecraft:purple_dye"
    - "minecraft:magenta_dye"
    - "minecraft:gray_dye"
    - "minecraft:white_dye"

  # Item-form edible herbs (the block tag #c:herbs never matches an eaten item).
  # Drives the herbalism consume_item XP source.
  edible_herbs:
    - "minecraft:sweet_berries"
    - "minecraft:glow_berries"
    - "minecraft:brown_mushroom"
    - "minecraft:red_mushroom"

  # The blendable soil blocks the herbalism Earth Charm (L25 terrain
  # transmutation) can transform. Dirt and netherrack are the spreadable
  # baselines a catalyst (seeds, fungus, mushroom, leaf litter) converts.
  herbal_soil:
    - "#minecraft:dirt"
    - "minecraft:netherrack"

  # The forage set rolled by the L15 Hidden Bounty and flagged for grass/fern
  # loot-reveal: every herb plus common short/tall grasses and ferns and flowers.
  forage:
    - "#c:herbs"
    - "#minecraft:small_flowers"
    - "minecraft:short_grass"
    - "minecraft:tall_grass"
    - "minecraft:fern"
    - "minecraft:large_fern"

  heavy_weapons:
    - "minecraft:iron_axe"
    - "minecraft:diamond_axe"
    - "minecraft:netherite_axe"
    - "minecraft:mace"

  light_weapons:
    - "minecraft:wooden_sword"
    - "minecraft:stone_sword"
    - "minecraft:golden_sword"
    - "minecraft:iron_sword"
    - "minecraft:diamond_sword"
    - "minecraft:netherite_sword"
    - "minecraft:trident"

  # Any sword, axe, or mace. The dual-wield skill's both-hands weapon set.
  # Not a misc weapon: tridents are excluded by design.
  melee_weapons:
    - "#minecraft:swords"
    - "#minecraft:axes"
    - "minecraft:mace"

  # Every one-handed wieldable melee tool and weapon. Covers both the light and
  # heavy weapon lines plus improvised tools (shears, hoes, pickaxes, shovels),
  # so the one_handed skill's offense flows from whatever combat gear is held.
  # Broader than #c:melee_weapons because one_handed is a wield-style skill, not
  # a weapon-type skill; it deliberately stays disjoint from the armor tags.
  melee:
    - "#minecraft:swords"
    - "#minecraft:axes"
    - "minecraft:mace"
    - "minecraft:trident"
    - "#minecraft:shears"
    - "#minecraft:hoes"
    - "#minecraft:pickaxes"
    - "#minecraft:shovels"

  tools:
    - "#minecraft:pickaxes"
    - "#minecraft:axes"
    - "#minecraft:shovels"
    - "#minecraft:hoes"
    - "#minecraft:swords"
    - "minecraft:bow"
    - "minecraft:crossbow"
    - "minecraft:trident"
    - "minecraft:mace"
    - "#minecraft:chest_armor"
    - "#minecraft:foot_armor"
    - "#minecraft:head_armor"
    - "#minecraft:leg_armor"

  leather_armor:
    - "minecraft:leather_helmet"
    - "minecraft:leather_chestplate"
    - "minecraft:leather_leggings"
    - "minecraft:leather_boots"

  # The full enchantable gear set in item form. Used by the enchanting skill's
  # Enchant Extraction requirement so only an actually-enchanted piece of gear in
  # the main hand qualifies. Enchanted books are deliberately excluded — they are
  # never a valid extraction source, which blocks a book-duplication loop.
  enchantable:
    - "#minecraft:swords"
    - "#minecraft:axes"
    - "#minecraft:pickaxes"
    - "#minecraft:shovels"
    - "#minecraft:hoes"
    - "minecraft:bow"
    - "minecraft:crossbow"
    - "minecraft:trident"
    - "minecraft:mace"
    - "#minecraft:head_armor"
    - "#minecraft:chest_armor"
    - "#minecraft:leg_armor"
    - "#minecraft:foot_armor"
    - "minecraft:shield"
    - "minecraft:fishing_rod"
    - "minecraft:elytra"

  # Armor tier tags drive the equipped_all / equipped_any state filters. They
  # reproduce the historical hard-coded tier sets as data, so armor gating is
  # fully configurable and no tier knowledge lives in Java.
  light_armor:
    - "#c:leather_armor"

  medium_armor:
    - "minecraft:chainmail_helmet"
    - "minecraft:chainmail_chestplate"
    - "minecraft:chainmail_leggings"
    - "minecraft:chainmail_boots"
    - "minecraft:iron_helmet"
    - "minecraft:iron_chestplate"
    - "minecraft:iron_leggings"
    - "minecraft:iron_boots"
    - "minecraft:turtle_helmet"

  heavy_armor:
    - "minecraft:golden_helmet"
    - "minecraft:golden_chestplate"
    - "minecraft:golden_leggings"
    - "minecraft:golden_boots"
    - "minecraft:diamond_helmet"
    - "minecraft:diamond_chestplate"
    - "minecraft:diamond_leggings"
    - "minecraft:diamond_boots"
    - "minecraft:netherite_helmet"
    - "minecraft:netherite_chestplate"
    - "minecraft:netherite_leggings"
    - "minecraft:netherite_boots"

  # Anything wearable in an armor slot that is not armor: empty (AIR) plus
  # helmet-slot headwear and the elytra. Used with equipped_all:#c:unarmored so
  # the unarmored skill grants XP when every slot is empty or holds such an item.
  unarmored:
    - "minecraft:air"
    - "minecraft:elytra"
    - "minecraft:carved_pumpkin"
    - "minecraft:jack_o_lantern"
    - "minecraft:skeleton_skull"
    - "minecraft:wither_skeleton_skull"
    - "minecraft:zombie_head"
    - "minecraft:player_head"
    - "minecraft:creeper_head"
    - "minecraft:dragon_head"
    - "minecraft:piglin_head"

  bows:
    - "minecraft:bow"
    - "minecraft:crossbow"

  instruments:
    - "minecraft:goat_horn"

  # All music discs in item form. Used to gate the bard's disc-into-jukebox XP
  # source and the free (no-cost) Stage Presence ability on the jukebox_play
  # trigger, so only an actual music disc inserted into a jukebox counts.
  music_discs:
    - "minecraft:music_disc_13"
    - "minecraft:music_disc_cat"
    - "minecraft:music_disc_blocks"
    - "minecraft:music_disc_chirp"
    - "minecraft:music_disc_far"
    - "minecraft:music_disc_mall"
    - "minecraft:music_disc_mellohi"
    - "minecraft:music_disc_stal"
    - "minecraft:music_disc_strad"
    - "minecraft:music_disc_ward"
    - "minecraft:music_disc_11"
    - "minecraft:music_disc_wait"
    - "minecraft:music_disc_otherside"
    - "minecraft:music_disc_pigstep"
    - "minecraft:music_disc_5"
    - "minecraft:music_disc_relic"
    - "minecraft:music_disc_creator"
    - "minecraft:music_disc_creator_music_box"
    - "minecraft:music_disc_precipice"
    - "minecraft:music_disc_tears"
    - "minecraft:music_disc_lava_chicken"

  # Signed written books (the item form, not book & quill). Used by the bard's
  # Lectern Story ability on the lectern_place trigger so only a completed
  # (signed) story placed on a lectern summons the party buff.
  written_books:
    - "minecraft:written_book"

  # Lectern blocks in item form, for craft/place XP targets where an item-form
  # tag is unambiguous (the vanilla tag is a block tag).
  lecterns:
    - "minecraft:lectern"


  fishing_rods:
    - "minecraft:fishing_rod"

  # Raw, edible fish caught with a fishing rod. The item-form set the Fishing
  # skill's consume_item XP source and Plump Bait reward target run on.
  fish:
    - "minecraft:cod"
    - "minecraft:salmon"
    - "minecraft:pufferfish"
    - "minecraft:tropical_fish"

  # Common bait the Fishing skill's Plump Bait (L25) consumes from the offhand
  # to shift a catch's quality/type. Cheap, abundant mob drops with low
  # alternative value, so bait costs something but never hurts the supply loop.
  bait_common:
    - "minecraft:spider_eye"
    - "minecraft:rotten_flesh"
    - "minecraft:bone"

  # Premium bait reserved for a future line. Rare, thematically aquatic, and not
  # useful in bulk; intentionally NOT consumed by any bundled ability so the
  # relaxed capstone never demands a costly habit.
  bait_rare:
    - "minecraft:glow_ink_sac"
    - "minecraft:nautilus_shell"

  # XP-source design (REPORT_XP-SOURCE-DESIGN §5) material tags.
  holy_blocks:
    - "minecraft:beacon"
    - "minecraft:conduit"
    - "minecraft:lantern"
    - "minecraft:soul_lantern"
    - "minecraft:sea_lantern"
    - "minecraft:glowstone"
    - "minecraft:gold_block"
    - "#minecraft:candles"

  crops:
