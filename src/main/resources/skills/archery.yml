# ==========================================
# ARCHERY SKILL
# ==========================================
# The marksman and hunter skill. It earns XP from landing arrows and from
# crafting its own ammunition, and it turns a bow into a precision tool: arrow
# damage scales up (L1), spent arrows come back (L15), full sneaking draws
# pierce armor (L25 Aimed Shot), arrows mark prey with Glowing (L50 Hunter's
# Mark), marked prey takes bonus damage (L75 Hunting Prowess), and at master
# level every arrow pierces armor (L100 Heartseeker).
#
# XP loop: arrow hits (damage-scaled), arrow kills (finishing a target), and
# crafting bows (costly) and arrows (bulk, low return). There is deliberately no
# "fired a shot" source: with an Infinity bow an arrow costs nothing, so free
# spam must not out-earn a hit. Skill comes from landing and finishing shots.
id: "archery"
max_level: 100
display: { name: "Archery", icon: "minecraft:bow", color: "RED", style: "SEGMENTED_10" }
progression: { curve: "polynomial", base_xp: 50, exponent: 2.5 }
xp_sources:
  # Damage-scaled, the grindable driver. A full-charge bow deal 8 raw damage,
  # so 6.4 per point is ~51 per full hit. Hits cost arrows and draw time.
  - trigger: "entity_damage"
    filters: [ { target: "#minecraft:arrows" } ]
    reward: { constant: 6.4 }
    scaling: damage
  # Finishing a target with an arrow. A kill is less frequent than a hit, so it
  # pays a flat bonus on top of the damage already earned for the fight.
  - trigger: "entity_kill"
    filters: [ { target: "#minecraft:arrows" } ]
    reward: { constant: 51.3 }
  # Crafting a bow is a real material cost (3 sticks + 3 string), so it pays well.
  - trigger: "craft_item"
    filters: [ { target: "#c:bows" } ]
    reward: { constant: 45.0 }
  # Crafting arrows is cheap and bulk: one craft needs a stick, flint, and one
  # feather and yields 4 arrows, so the return is deliberately low (bulk = minor).
  - trigger: "craft_item"
    filters: [ { target: "#minecraft:arrows" } ]
    reward: { constant: 6.0 }
abilities:
  # -- FOUNDATIONAL (L1): the primary scalar. Arrow damage grows from level 1 so
  # the whole climb is felt. Sub-scaling reaches ~1.5x at level 100.
  - id: "steady_hand"
    display_name: "Steady Hand"
    unlock_level: 1
    trigger: "entity_damage"
    display: { lore: [ "&7Arrow damage &a{multiplier}x&7." ] }
    mechanics:
      - type: "core:modify_damage"
        filters: [ { target: "#minecraft:arrows" } ]
        parameters:
          multiplier: { linear: { base: 1.05, step: 0.0045, max: 1.5 } }
    feedback: { notify: { action_bar: false } }

  # -- QOL PASSIVE (L15): spent arrows come back. Unique to archery and keeps
  # the ammo economy alive. Grows from 16% to a 50% cap at level 100.
  - id: "arrow_recovery"
    display_name: "Arrow Recovery"
    unlock_level: 15
    trigger: "projectile_hit"
    display: { lore: [ "&a{chance}%&7 chance to recover fired arrows on hit." ] }
    mechanics:
      - type: "core:projectile_return"
        filters: [ { target: "#minecraft:arrows" } ]
        parameters:
          chance: { linear: { base: 16.0, step: 0.4, max: 50.0 } }
    feedback: { notify: { action_bar: false } }

  # -- PRIMARY ABILITY (L25): the aimed shot. Releasing a fully stealthed (sneak)
  # draw spends hunger to drive the arrow straight through armor. No cooldown:
  # the hunger cost is the gate, exactly like the acrobatics Leap. The
  # "was_sneaking" condition reads the sneak stance captured at release, so the
  # shot counts only if the player was sneaking when it left the bow.
  - id: "aimed_shot"
    display_name: "Aimed Shot"
    unlock_level: 25
    trigger: "entity_damage"
    display:
      lore:
        - "&7Sneak-shots pierce armor: +&a{damage}&7 bonus damage & +&a{percent}&7 of target max health."
        - "&7Costs 1 hunger."
        - "&8Requires: Sneaking while firing, 3+ hunger."
    requirements:
      state: [ "was_sneaking" ]
      exhaustion: { amount: 1.0, minimum: 3.0 }
    on_failure:
      exhaustion: { action_bar: "&cToo hungry to aim!" }
    mechanics:
      - type: "core:true_damage"
        filters: [ { target: "#minecraft:arrows" } ]
        parameters:
          damage: { linear: { base: 6.0, step: 0.04, max: 9.0 } }
          percent: { linear: { base: 0.02, step: 0.0008, max: 0.08 } }
    feedback:
      notify: { action_bar: true, chat: false, message: "&cAimed Shot!" }
      sounds: [ { type: "minecraft:entity.arrow.hit_player", volume: 0.5, pitch: 1.2, target: "target" } ]

  # -- MAJOR PASSIVE (L50): marking prey. Every arrow leaves the target soft-
  # glowing — the hunter's tracking aid — and spectral arrows hold it longer, so
  # the premium ammo sustains the Hunting Prowess bonus for a whole fight.
  # Sub-scaling lives in the spectral duration (12s -> a 20s cap at level 100),
  # keeping vanilla's 10s spectral glow as a floor that the skill now exceeds.
  - id: "hunters_mark"
    display_name: "Hunter's Mark"
    unlock_level: 50
    trigger: "entity_damage"
    display:
      lore:
        - "&7Every arrow marks targets with Glowing for &a4s&7."
        - "&7Spectral arrows hold the mark for &a{duration}s&7."
    mechanics:
      - type: "core:apply_status"
        filters: [ { target: "#minecraft:arrows" } ]
        parameters:
          effect: { constant: "minecraft:glowing" }
          duration: { constant: 4.0 }
          amplifier: { constant: 0.0 }
      - type: "core:apply_status"
        filters: [ { target: "minecraft:spectral_arrow" } ]
        parameters:
          effect: { constant: "minecraft:glowing" }
          duration: { linear: { base: 12.0, step: 0.16, max: 20.0 } }
          amplifier: { constant: 0.0 }
    feedback: { notify: { action_bar: false } }

  # -- SYNERGY PASSIVE (L75): punishing the mark. Arrows deal bonus damage to a
  # target already glowing, riding on the Hunter's Mark from level 50 (and any
  # spectral arrows). Multiplier reaches 1.6x against marked targets at L100.
  - id: "hunting_prowess"
    display_name: "Hunting Prowess"
    unlock_level: 75
    trigger: "entity_damage"
    display:
      lore:
        - "&7Arrows deal &a{multiplier}x&7 damage against Glowing targets."
        - "&8Requires: target marked with Glowing."
    mechanics:
      - type: "core:modify_damage"
        filters:
          - { target: "#minecraft:arrows" }
          - { state: "target_status:minecraft:glowing" }
        parameters:
          multiplier: { linear: { base: 1.1, step: 0.02, max: 1.6 } }
    feedback: { notify: { action_bar: false } }

  # -- MASTERY CAPSTONE (L100): the hunter's finish. Every arrow now pierces
  # armor, so no foe ever shrugs an archer's shot again. A constant strong value
  # (the sanctioned capstone exception: there are no levels left to grow).
  - id: "heartseeker"
    display_name: "Heartseeker"
    unlock_level: 100
    trigger: "entity_damage"
    display:
      lore:
        - "&7Every arrow pierces armor: +&a4&7 bonus damage & +&a6%&7 of target max health."
    mechanics:
      - type: "core:true_damage"
        filters: [ { target: "#minecraft:arrows" } ]
        parameters:
          damage: { constant: 4.0 }
          percent: { constant: 0.06 }
    feedback: { notify: { action_bar: false } }
