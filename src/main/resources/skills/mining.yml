id: "mining"
max_level: 100

display:
  name: "Mining"
  icon: "minecraft:iron_pickaxe"
  color: "GREEN"
  style: "SEGMENTED_10"

progression:
  curve: "polynomial"
  base_xp: 50
  exponent: 2.5

xp_sources:
  - trigger: "block_break"
    filters:
      - target: "#c:ores"
      - state: "player_placed:false"
    reward:
      constant: 15.0

  - trigger: "block_break"
    filters:
      - target: "#c:stone"
      - state: "player_placed:false"
    reward:
      constant: 2.0

abilities:
  - id: "geologist"
    display_name: "Geologist"
    unlock_level: 1
    display:
      lore:
        - "&7Increases ore yield by &a{yield_chance}%&7."
    mechanics:
      - type: "core:yield_multiplier"
        filters:
          - target: "#c:ores"
          - tool: "#minecraft:pickaxes"
        parameters:
          yield_chance:
            linear:
              base: 0.5
              step: 0.5
              max: 50.0
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "prospector"
    display_name: "Prospector"
    unlock_level: 15
    display:
      lore:
        - "&7Gain bonus XP from mining ores."
    mechanics:
      - type: "core:xp_bonus"
        parameters:
          multiplier:
            linear:
              base: 1.5
              step: 0.015
              max: 3.0
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "vein_miner"
    display_name: "Vein Miner"
    unlock_level: 25
    display:
      lore:
        - "&7Sneak-mine to break up to &a{chain_limit} &7connected blocks."
        - "&7Exhaustion cost: 2 hunger."
    requirements:
      cooldown: 5.0
      state:
        - "is_sneaking"
      items:
        - action: "possession"
          tag: "#minecraft:pickaxes"
          slot: "MAIN_HAND"
        - action: "cost"
          tag: "minecraft:coal"
          amount: 1
      exhaustion:
        amount: 2.0
        minimum: 3.0
    on_failure:
      cooldown:
        action_bar: "&cVein Miner cooling down: {time}s"
        sounds:
          - type: "BLOCK_NOTE_BLOCK_BASS"
            volume: 1.0
            pitch: 0.5
      missing_item:
        action_bar: "&cRequires {amount}x {item} to power Vein Miner!"
      exhaustion:
        action_bar: "&cToo exhausted to mine!"
    mechanics:
      - type: "core:chain_break"
        filters:
          - target: "#c:veinminer"
        parameters:
          chain_limit:
            milestones:
              25: 3
              50: 8
              75: 16
              100: 32
    feedback:
      notify:
        action_bar: true
        chat: false
        message: "&b✦ Vein Miner Activated! ✦"
      particles:
        - type: "BLOCK_CRACK"
          count: 15
          offset: [0.5, 0.5, 0.5]
          speed: 0.1
          target: "target"
      sounds:
        - type: "ENTITY_ZOMBIE_BREAK_WOODEN_DOOR"
          volume: 0.5
          pitch: 1.2
          target: "self"

  - id: "magma_forge"
    display_name: "Magma Forge"
    unlock_level: 50
    display:
      lore:
        - "&7Ores have a &a{chance}% &7chance to auto-smelt."
    mechanics:
      - type: "core:auto_smelt"
        parameters:
          chance:
            linear:
              base: 25.0
              step: 0.5
              max: 75.0
    feedback:
      notify:
        action_bar: false

  - id: "sturdy_miner"
    display_name: "Sturdy Miner"
    unlock_level: 75
    display:
      lore:
        - "&7Gain &a{amount} &7armor while mining."
    mechanics:
      - type: "core:armor_bonus"
        filters:
          - tool: "#minecraft:pickaxes"
        parameters:
          amount:
            linear:
              base: 0.0
              step: 0.01
              max: 1.0
    feedback:
      notify:
        action_bar: false

  - id: "perfect_yield"
    display_name: "Perfect Yield"
    unlock_level: 100
    display:
      lore:
        - "&7Guaranteed double ore drops with a chance for triple."
    mechanics:
      - type: "core:yield_multiplier"
        filters:
          - target: "#c:ores"
        parameters:
          yield_chance:
            constant: 100.0
    feedback:
      notify:
        action_bar: false
