id: "light_armor"
max_level: 100

display:
  name: "Light Armor"
  icon: "minecraft:leather_chestplate"
  color: "BLUE"
  style: "SOLID"

progression:
  curve: "polynomial"
  base_xp: 50
  exponent: 2.5

xp_sources:
  - trigger: "entity_damage_taken"
    reward:
      constant: 3.0

abilities:
  - id: "featherweight"
    display_name: "Featherweight"
    unlock_level: 1
    display:
      lore:
        - "&7Move &a{multiplier}x &7faster."
    mechanics:
      - type: "core:speed_bonus"
        parameters:
          multiplier:
            linear:
              base: 1.05
              step: 0.002
              max: 1.25
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "dodge_roll"
    display_name: "Dodge Roll"
    unlock_level: 15
    display:
      lore:
        - "&a{chance}% &7chance to completely dodge attacks."
    mechanics:
      - type: "core:dodge"
        parameters:
          chance:
            linear:
              base: 5.0
              step: 0.2
              max: 25.0
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "nimble_feet"
    display_name: "Nimble Feet"
    unlock_level: 25
    display:
      lore:
        - "&a{chance}% &7chance to negate fall damage."
    mechanics:
      - type: "core:cancel_damage"
        parameters:
          chance:
            linear:
              base: 10.0
              step: 0.3
              max: 40.0
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "sprint"
    display_name: "Sprint"
    unlock_level: 50
    display:
      lore:
        - "&7Move &a{multiplier}x &7faster with light armor."
    mechanics:
      - type: "core:speed_bonus"
        parameters:
          multiplier:
            linear:
              base: 1.1
              step: 0.002
              max: 1.3
    feedback:
      notify:
        action_bar: false

  - id: "evasion_mastery"
    display_name: "Evasion Mastery"
    unlock_level: 75
    display:
      lore:
        - "&7Dodge chance increased significantly."
    mechanics:
      - type: "core:dodge"
        parameters:
          chance:
            linear:
              base: 10.0
              step: 0.3
              max: 40.0
    feedback:
      notify:
        action_bar: false

  - id: "phantom"
    display_name: "Phantom"
    unlock_level: 100
    display:
      lore:
        - "&7Near-permanent dodge and speed boost."
    mechanics:
      - type: "core:dodge"
        parameters:
          chance:
            constant: 50.0
      - type: "core:speed_bonus"
        parameters:
          multiplier:
            constant: 1.3
    feedback:
      notify:
        action_bar: false
