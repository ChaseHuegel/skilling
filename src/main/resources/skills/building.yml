# ==========================================
# BUILDING SKILL
# ==========================================
# The construction skill. It earns XP from the build loop — craft, place, and
# tear down — and rewards a builder who is thrifty with materials, fast at
# tearing things down, and masters the redstone and explosive trades.
#
# Abilities: refund placed construction (L1), quick dismantle (L15), extended
# reach while sneaking (L25), redstone & explosive craft output (L50), controlled
# demolition of your own structures (L75), and creative flight while wearing an
# elytra (L100).
#
# XP loop: craft construction materials (bulk-scaled, cheap crafts reward a
# little), place blocks (time-gated), then tear down your own placed blocks
# (player_placed:true) — the grindable, anti-grind-safe driver.
id: "building"
max_level: 100
display: { name: "Building", icon: "minecraft:bricks", color: "YELLOW", style: "SEGMENTED_10" }
progression: { curve: "polynomial", base_xp: 50, exponent: 2.5 }
xp_sources:
  # Placing construction & redstone materials is the core placement loop.
  - trigger: "block_place"
    filters: [ { target: "#c:construction_blocks" } ]
    reward: { constant: 35.0 }
  # Encompassing build blocks until masonry/carpentry later claim their loops.
  - trigger: "block_place"
    filters: [ { target: "#c:stone_products" } ]
    reward: { constant: 40.0 }
  - trigger: "block_place"
    filters: [ { target: "#minecraft:planks" } ]
    reward: { constant: 40.0 }
  # Tearing down blocks you placed is the grindable driver: time-gated, honest,
  # and cannot be farmed on natural terrain.
  - trigger: "block_break"
    filters:
      - target: "#c:demolition_blocks"
      - state: "player_placed:true"
    reward: { constant: 35.0 }
  # Crafting construction materials. Bulk-scaled with a modest rate: these are
  # cheap, spammable crafts, so the per-craft reward is small.
  - trigger: "craft_item"
    filters: [ { target: "#c:construction_crafts" } ]
    reward: { constant: 30.0 }
abilities:
  # -- FOUNDATIONAL (L1): the primary scalar. A chance to refund the construction
  # block you just placed, so steady building conserves material. Sub-scales from
  # level 1 so the thrift is felt across the whole climb.
  - id: "foundation_stockpile"
    display_name: "Foundation Stockpile"
    unlock_level: 1
    trigger: "block_place"
    display:
      lore:
        - "&7Placing construction blocks has &a{chance}%&7 chance to refund the block."
    mechanics:
      - type: "core:block_refund"
        filters: [ { target: "#c:construction_blocks" } ]
        parameters:
          chance: { linear: { base: 5.0, step: 0.45, max: 50.0 } }
    feedback: { notify: { action_bar: false } }
  # -- QoL PASSIVE (L15): tear down a placed block and the surrounding 3x3 for
  # re-use. Radius and block budget carry the loop through the levels, so no
  # later milestone re-treads the same teardown.
  - id: "quick_dismantle"
    display_name: "Quick Dismantle"
    unlock_level: 15
    trigger: "block_break"
    display:
      lore:
        - "&7Sneak-break a placed block to dismantle up to &a{max_blocks}&7"
        - "&7same-type blocks around it for re-use (radius &a{radius}&7)."
        - "&7Costs 1 hunger."
        - "&8Requires: Sneaking, breaking a player-placed block, 3+ hunger."
    requirements:
      state: [ "is_sneaking" ]
      exhaustion: { amount: 1.0, minimum: 3.0 }
    on_failure:
      exhaustion: { action_bar: "&cToo exhausted to dismantle!" }
    mechanics:
      - type: "core:area_harvest"
        filters:
          - target: "#c:demolition_blocks"
          - state: "player_placed:true"
        parameters:
          radius: { milestones: { 15: 1, 40: 2, 70: 3 } }
          max_blocks: { linear: { base: 8.0, step: 0.4, max: 48.0 } }
    feedback: { notify: { action_bar: false } }
  # -- QUALITY-OF-LIFE PASSIVE (L25): sneaking extends placement/interaction
  # reach for a building session. No cost, no gesture — pure builder comfort.
  - id: "architects_reach"
    display_name: "Architect's Reach"
    unlock_level: 25
    trigger: "sneak"
    display:
      lore: [ "&7Sneaking grants +&a{amount}&7 block placement & interaction reach." ]
    mechanics:
      - type: "core:modify_attribute"
        parameters:
          attribute: { constant: "minecraft:block_interaction_range" }
          amount: { milestones: { 25: 1, 50: 2, 75: 3, 100: 4 } }
          duration: { constant: 300.0 }
          uuid: { constant: "8d2b5a14-6c31-4e8a-9c2d-1f0a7b3e5c40" }
    feedback: { notify: { action_bar: false } }
  # -- MAJOR PASSIVE (L50): the redstone & explosive trades. Crafting these pays
  # bonus output, giving gunpowder and fireworks a sink that fuels the capstone.
  - id: "contraption_factory"
    display_name: "Contraption Factory"
    unlock_level: 50
    trigger: "craft_item"
    display:
      lore: [ "&7Redstone & explosive crafts yield &a{multiplier}x&7 output." ]
    mechanics:
      - type: "core:modify_craft_output"
        filters: [ { target: "#c:redstone_components" } ]
        parameters:
          multiplier: { linear: { base: 1.2, step: 0.008, max: 2.0 } }
      - type: "core:modify_craft_output"
        filters: [ { target: "#c:explosives" } ]
        parameters:
          multiplier: { linear: { base: 1.2, step: 0.008, max: 2.0 } }
    feedback: { notify: { action_bar: false } }
  # -- SYNERGY PASSIVE (L75): a TNT you sneak-place becomes a demolition charge
  # that breaks only your placed construction blocks (recovered as drops),
  # sparing terrain and other players' builds. All other TNT stays 100% vanilla,
  # so mining/clearing with TNT is untouched.
  - id: "controlled_demolition"
    display_name: "Controlled Demolition"
    unlock_level: 75
    trigger: "block_place"
    display:
      lore:
        - "&7Sneak-place TNT to detonate only your placed construction blocks."
        - "&8Requires: Sneaking, placing TNT."
    mechanics:
      - type: "core:marked_demolition"
        filters: [ { target: "minecraft:tnt" } ]
        parameters:
          target: { constant: "#c:demolition_blocks" }
    feedback: { notify: { action_bar: false } }
  # -- MASTERY CAPSTONE (L100): creative flight while wearing an elytra, the
  # ultimate builder's reward — controlled points of view build faster than
  # scaffolding ever could. Requires the existing vanilla elytra, amplifies its
  # use without replacing it, and stays a constant strong reward.
  - id: "aerial_architect"
    display_name: "Aerial Architect"
    unlock_level: 100
    trigger: "level_up"
    display:
      lore: [ "&7Creative flight while wearing an elytra." ]
    mechanics:
      - type: "core:elytra_flight"
    feedback: { notify: { action_bar: false } }
