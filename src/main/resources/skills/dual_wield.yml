id: "dual_wield"
max_level: 100

display:
  name: "Dual Wield"
  icon: "minecraft:netherite_sword"
  color: "RED"
  style: "SEGMENTED_10"

progression:
  curve: "polynomial"
  base_xp: 50
  exponent: 2.5

xp_sources:
  - trigger: "entity_damage"
    filters:
      - state: "offhand:weapon"
    reward:
      constant: 6.0

  - trigger: "entity_kill"
    filters:
      - state: "offhand:weapon"
    reward:
      constant: 25.0

abilities:
  - id: "dual_strike"
    display_name: "Dual Strike"
    unlock_level: 1
    trigger: "entity_damage"
    display:
      lore:
        - "&7Increases dual-wield damage by &a{multiplier}x&7."
    mechanics:
      - type: "core:modify_damage"
        filters:
          - state: "offhand:weapon"
        parameters:
          multiplier:
            linear:
              base: 1.05
              step: 0.003
              max: 1.35
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "whirlwind"
    display_name: "Whirlwind"
    unlock_level: 15
    trigger: "entity_damage"
    display:
      lore:
        - "&7Dual attacks weaken nearby enemies."
    mechanics:
      - type: "core:crowd_control"
        filters:
          - state: "offhand:weapon"
        parameters:
          effect:
            constant: 18.0
          radius:
            linear:
              base: 2.0
              step: 0.03
              max: 5.0
          duration:
            constant: 3.0
          amplifier:
            linear:
              base: 0
              step: 0.01
              max: 1
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "cross_cut"
    display_name: "Cross Cut"
    unlock_level: 25
    trigger: "entity_damage"
    display:
      lore:
        - "&7Dual strikes poison targets for &a{duration}s&7."
    mechanics:
      - type: "core:apply_status"
        filters:
          - state: "offhand:weapon"
        parameters:
          effect:
            constant: 19.0
          duration:
            linear:
              base: 2.0
              step: 0.03
              max: 5.0
          amplifier:
            constant: 0.0
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "rapid_assault"
    display_name: "Rapid Assault"
    unlock_level: 50
    trigger: "entity_damage"
    display:
      lore:
        - "&7Move &a{multiplier}x &7faster with two weapons."
    mechanics:
      - type: "core:speed_bonus"
        filters:
          - state: "offhand:weapon"
        parameters:
          multiplier:
            linear:
              base: 1.05
              step: 0.002
              max: 1.25
    feedback:
      notify:
        action_bar: false

  - id: "dual_parry"
    display_name: "Dual Parry"
    unlock_level: 75
    trigger: "entity_damage_taken"
    display:
      lore:
        - "&a{chance}% &7chance to block attacks with two weapons."
    mechanics:
      - type: "core:block_damage"
        filters:
          - state: "offhand:weapon"
        parameters:
          chance:
            linear:
              base: 5.0
              step: 0.2
              max: 25.0
    feedback:
      notify:
        action_bar: false

  - id: "storm_blade"
    display_name: "Storm Blade"
    unlock_level: 100
    trigger: "entity_damage"
    display:
      lore:
        - "&7Massive dual-wield damage boost."
    mechanics:
      - type: "core:modify_damage"
        filters:
          - state: "offhand:weapon"
        parameters:
          multiplier:
            constant: 2.5
    feedback:
      notify:
        action_bar: false
