id: "alchemy"
max_level: 100

display:
  name: "Alchemy"
  icon: "minecraft:brewing_stand"
  color: "PURPLE"
  style: "SEGMENTED_10"

progression:
  curve: "polynomial"
  base_xp: 50
  exponent: 2.5

xp_sources:
  - trigger: "brew_potion"
    reward:
      constant: 10.0

abilities:
  - id: "rapid_brewing"
    display_name: "Rapid Brewing"
    unlock_level: 1
    trigger: "brew_potion"
    display:
      lore:
        - "&7Brews potions &a{multiplier}x &7faster."
    mechanics:
      - type: "core:modify_brew_time"
        parameters:
          multiplier:
            linear:
              base: 1.0
              step: 0.005
              max: 1.5
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "extended_effects"
    display_name: "Extended Effects"
    unlock_level: 15
    trigger: "brew_potion"
    display:
      lore:
        - "&7Brewed potions last &a{multiplier}x &7longer."
    mechanics:
      - type: "core:modify_potion_duration"
        parameters:
          multiplier:
            linear:
              base: 1.0
              step: 0.005
              max: 1.5
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "efficient_alchemy"
    display_name: "Efficient Alchemy"
    unlock_level: 25
    trigger: "brew_potion"
    display:
      lore:
        - "&7Gain bonus XP from brewing."
    mechanics:
      - type: "core:xp_bonus"
        parameters:
          multiplier:
            linear:
              base: 1.5
              step: 0.015
              max: 3.0
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "concentrated_essence"
    display_name: "Concentrated Essence"
    unlock_level: 50
    trigger: "brew_potion"
    display:
      lore:
        - "&7Potions last &a{multiplier}x &7longer."
    mechanics:
      - type: "core:modify_potion_duration"
        parameters:
          multiplier:
            linear:
              base: 1.0
              step: 0.01
              max: 2.0
    feedback:
      notify:
        action_bar: false

  - id: "alchemical_haste"
    display_name: "Alchemical Haste"
    unlock_level: 75
    trigger: "brew_potion"
    display:
      lore:
        - "&7Move &a{multiplier}x &7faster while brewing."
    mechanics:
      - type: "core:speed_bonus"
        parameters:
          multiplier:
            linear:
              base: 1.05
              step: 0.002
              max: 1.25
    feedback:
      notify:
        action_bar: false

  - id: "master_alchemist"
    display_name: "Master Alchemist"
    unlock_level: 100
    trigger: "brew_potion"
    display:
      lore:
        - "&7Potions brew instantly and last forever."
    mechanics:
      - type: "core:modify_brew_time"
        parameters:
          multiplier:
            constant: 0.5
      - type: "core:modify_potion_duration"
        parameters:
          multiplier:
            constant: 3.0
    feedback:
      notify:
        action_bar: false
