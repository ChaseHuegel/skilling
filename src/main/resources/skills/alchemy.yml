id: "alchemy"
max_level: 100
display: { name: "Alchemy", icon: "minecraft:brewing_stand", color: "PURPLE", style: "SEGMENTED_10" }
progression: { curve: "polynomial", base_xp: 50, exponent: 2.5 }
xp_sources:
  # Finishing a brewing batch is the rare, time- and resource-gated source.
  - trigger: "brew_potion"
    reward: { constant: 150.0 }
  # Cheap, spammable via water bottles: the low-value grindable source.
  - trigger: "potion_splash"
    reward: { constant: 40.0 }
  # Drinking a potion costs its ingredients and a share of its effect cooldown.
  - trigger: "consume_item"
    filters: [ { target: "#c:potions" } ]
    reward: { constant: 120.0 }
  # Witches drop brewing ingredients (redstone, glowstone, sugar, spider eye, glass).
  - trigger: "entity_kill"
    filters: [ { state: "target_type:minecraft:witch" } ]
    reward: { constant: 120.0 }
  # Ingredient gathering is grow-gated and grindable (nether wart, glowstone).
  - trigger: "block_break"
    filters: [ { target: "#c:potion_flora" }, { state: "player_placed:false" } ]
    reward: { constant: 50.0 }
  # The ultimate alchemical act: curing a zombie villager. Very rare, big payout.
  - trigger: "cure_villager"
    reward: { constant: 400.0 }
abilities:
  # L1 identity: the brewing "yield" scalar, mirroring mining/farming/herbalism.
  - id: "overbrew"
    display_name: "Overbrew"
    unlock_level: 1
    trigger: "brew_potion"
    display: { lore: [ "&7Brewing grants a &a{chance}%&7 chance at an extra bottle." ] }
    mechanics:
      - type: "core:modify_brew_output"
        parameters:
          chance: { linear: { base: 5.0, step: 0.45, max: 50.0 } }
    feedback: { notify: { action_bar: false } }
  # L15 QoL: shorten the brewing cycle (moved up from the old L1 brew-time slot).
  - id: "rapid_brewing"
    display_name: "Rapid Brewing"
    unlock_level: 15
    trigger: "brew_start"
    display: { lore: [ "&7Brew time &a{multiplier}x&7 (faster)." ] }
    mechanics:
      - type: "core:modify_brew_time"
        parameters:
          multiplier: { linear: { base: 0.9, step: -0.005, max: 0.5 } }
    feedback: { notify: { action_bar: false } }
  # L25 active: the cauldron transmutation hook. Keep the table data-driven by
  # adding/removing core:transmute mechanics; the engine picks the one whose
  # source matches the held main-hand item.
  - id: "transmutation"
    display_name: "Transmutation"
    unlock_level: 25
    trigger: "right_click_block"
    display:
      lore:
        - "&7Sneak + interact a cauldron to transmute metal."
        - "&74 Iron Ingot &8-> &61 Gold Ingot"
        - "&74 Gold Ingot &8-> &61 Diamond"
        - "&7Costs 1 Blaze Powder."
        - "&8Requires: Sneaking, 30s cooldown, 3+ hunger."
    requirements:
      cooldown: { linear: { base: 30.0, step: -0.2, max: 10.0 } }
      state: [ "is_sneaking" ]
      items: [ { action: "cost", tag: "minecraft:blaze_powder", amount: 1 } ]
      exhaustion: { amount: 2.0, minimum: 3.0 }
    on_failure:
      cooldown: { action_bar: "&eTransmutation cooling down: {time}s" }
      missing_item: { action_bar: "&cNothing here can be transmuted." }
      exhaustion: { action_bar: "&cToo hungry to transmute." }
    mechanics:
      - type: "core:transmute"
        filters: [ { target: "#c:cauldrons" } ]
        parameters:
          source: { constant: "minecraft:iron_ingot" }
          product: { constant: "minecraft:gold_ingot" }
          source_count: { constant: 4 }
          product_count: { constant: 1 }
      - type: "core:transmute"
        filters: [ { target: "#c:cauldrons" } ]
        parameters:
          source: { constant: "minecraft:gold_ingot" }
          product: { constant: "minecraft:diamond" }
          source_count: { constant: 4 }
          product_count: { constant: 1 }
    feedback:
      notify: { action_bar: true, chat: false, message: "&d✦ Transmuted! ✦" }
      particles: [ { type: "minecraft:enchant", count: 12, offset: [0.5, 0.5, 0.5], speed: 0.5, target: "target" } ]
  # L50 major passive: potion potency (amplifier), which also boosts instant potions
  # that a duration multiplier (old design) could never touch.
  - id: "concentrated_essence"
    display_name: "Concentrated Essence"
    unlock_level: 50
    trigger: "brew_potion"
    display: { lore: [ "&7Brewed potions gain +&a{amplifier}&7 potency." ] }
    mechanics:
      - type: "core:modify_potion_amplifier"
        parameters:
          amplifier: { milestones: { 50: 1, 100: 2 } }
    feedback: { notify: { action_bar: false } }
  # L75 synergy: your own thrown splash/lingering potions no longer harm you or allies.
  - id: "alchemists_aegis"
    display_name: "Alchemist's Aegis"
    unlock_level: 75
    trigger: "potion_splash"
    display: { lore: [ "&7Your thrown potions never harm you or allies." ] }
    mechanics:
      - type: "core:potion_self_immunity"
    feedback: { notify: { action_bar: false } }
  # L100 capstone: every brew guarantees an extra bottle (binary, mirrors Perfect Yield).
  - id: "masters_brew"
    display_name: "Masters' Brew"
    unlock_level: 100
    trigger: "brew_potion"
    display: { lore: [ "&7Every brew yields an extra bottle." ] }
    mechanics:
      - type: "core:modify_brew_output"
        parameters:
          chance: { constant: 100.0 }
    feedback: { notify: { action_bar: false } }
