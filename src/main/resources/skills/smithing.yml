          product_count: { linear: { base: 1.0, step: 0.02, max: 2.0 } }
          block: { constant: "#c:anvils" }
      # Mace returns the breeze rod at its heart.
      - type: "core:transmute"
        filters: [ { target: "#c:anvils" } ]
        parameters:
          source: { constant: "minecraft:mace" }
          product: { constant: "minecraft:breeze_rod" }
          source_count: { constant: 1 }
          product_count: { linear: { base: 1.0, step: 0.02, max: 2.0 } }
          block: { constant: "#c:anvils" }
    feedback:
      notify: { action_bar: true, chat: false, message: "&e✦ Salvaged! ✦" }
      sounds: [ { type: "minecraft:entity.item.pickup", volume: 0.6, pitch: 1.6, target: "self" } ]

  # L75 - Synergy passive: the anvil mastery. The anvil's maximum repair cost is
  # raised (no more "Too Expensive" wall) and the enchantment-level restriction
  # is lifted, so gear stays repairable as long as the player can pay. Binding
  # to the ungated anvil_prepare trigger lets the cap lift even on null results.
  - id: "masters_anvil"
    display_name: "Master's Anvil"
    unlock_level: 75
    trigger: "anvil_prepare"
    display: { lore: [ "&7Anvil repairs never surpass &a{cap}&7 levels." ] }
    mechanics:
      - type: "core:uncap_repair"
        parameters:
          cap: { linear: { base: 80.0, step: 2.0, max: 400.0 } }
    feedback: { notify: { action_bar: false } }

  # L100 - Mastery capstone: masterwork. Crafted metal/mineral gear has a chance
  # to come out of the forge naturally enchanted, replacing the old copy-cat
  # craft-output multiplier with a genuinely distinct mastery.
  - id: "masterwork_craft"
    display_name: "Masterwork Craft"
    unlock_level: 100
    trigger: "craft_item"
    display: { lore: [ "&a{chance}%&7 chance crafted metal gear comes enchanted." ] }
    mechanics:
      - type: "core:masterwork_craft"
        filters: [ { target: "#c:smithing" } ]
        parameters:
          chance: { linear: { base: 10.0, step: 0.8, max: 60.0 } }
    feedback: { notify: { action_bar: false } }