id: "smithing"
max_level: 100

display:
  name: "Smithing"
  icon: "minecraft:anvil"
  color: "YELLOW"
  style: "SEGMENTED_10"

progression:
  curve: "polynomial"
  base_xp: 50
  exponent: 2.5

xp_sources:
  - trigger: "craft_item"
    reward:
      constant: 12.0

  - trigger: "furnace_extract"
    filters:
      - target: "#minecraft:gold_ores"
    reward:
      constant: 8.0

  - trigger: "furnace_extract"
    filters:
      - target: "#minecraft:iron_ores"
    reward:
      constant: 6.0

abilities:
  - id: "efficient_smith"
    display_name: "Efficient Smith"
    unlock_level: 1
    trigger: "craft_item"
    display:
      lore:
        - "&7Increases output when crafting tools and armor."
    mechanics:
      - type: "core:modify_craft_output"
        parameters:
          multiplier:
            linear:
              base: 1.0
              step: 0.005
              max: 1.5
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "tempered_metal"
    display_name: "Tempered Metal"
    unlock_level: 15
    trigger: "item_damage"
    display:
      lore:
        - "&7Tools and armor last &a{chance}% &7longer."
    mechanics:
      - type: "core:durability_save"
        parameters:
          chance:
            linear:
              base: 10.0
              step: 0.4
              max: 50.0
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "weighted_strike"
    display_name: "Weighted Strike"
    unlock_level: 25
    trigger: "entity_damage"
    display:
      lore:
        - "&7Increases melee damage by &a{multiplier}x&7."
    mechanics:
      - type: "core:modify_damage"
        filters:
          - tool: "#minecraft:swords"
        parameters:
          multiplier:
            linear:
              base: 1.05
              step: 0.003
              max: 1.35
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "reforging"
    display_name: "Reforging"
    unlock_level: 50
    trigger: "furnace_extract"
    display:
      lore:
        - "&7Doubles ingot output when smelting ore."
    mechanics:
      - type: "core:modify_furnace_output"
        parameters:
          multiplier:
            linear:
              base: 1.0
              step: 0.01
              max: 2.0
    feedback:
      notify:
        action_bar: false

  - id: "master_smith"
    display_name: "Master Smith"
    unlock_level: 75
    trigger: "entity_damage"
    display:
      lore:
        - "&7Gain &a{amount} &7armor while wielding a smithed weapon."
    mechanics:
      - type: "core:armor_bonus"
        filters:
          - tool: "#minecraft:swords"
        parameters:
          amount:
            linear:
              base: 0.0
              step: 0.01
              max: 1.0
    feedback:
      notify:
        action_bar: false

  - id: "legendary_artisan"
    display_name: "Legendary Artisan"
    unlock_level: 100
    trigger: "craft_item"
    display:
      lore:
        - "&7Guaranteed double output on all smithed items."
    mechanics:
      - type: "core:modify_craft_output"
        parameters:
          multiplier:
            constant: 2.0
    feedback:
      notify:
        action_bar: false
