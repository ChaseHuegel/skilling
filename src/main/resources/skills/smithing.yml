# ==========================================
# SMITHING SKILL - The Forge Master
# ==========================================
# Forge raw ore into metal and mineral gear, craft tougher tools, sharpen your
# edge at the grindstone, salvage worn gear back into its primary material, and
# master the anvil. The loop is smelt ore -> craft gear -> sharpen it -> use,
# wear, repair, and finally salvage it back into raw material.
# Cleanly disjoint from Masonry (the kiln-craft of fired building stone) because
# smithing owns the metal/mineral durability set, the grindstone, and the anvil.
#
# Abilities (6-tier ladder):
#   L1   Efficient Repair    anvil repair costs scale down (identity scalar)
#   L15  Durable Craft       crafted metal/mineral gear carries more durability
#   L25  Sharpen Edge        grindstone hone: permanent mining efficiency on a tool
#   L50  Salvage             melt worn metal/mineral gear back into its primary material
#   L75  Master's Anvil      remove the anvil repair level cap and too-expensive wall
#   L100 Masterwork Craft    crafted gear has a chance to come out enchanted
#
# XP loop: smelting ore (fuel + time gated), crafting tools/armor (real material),
# repairing at the anvil (gear + xp gated), smithing-table work (scarce), and
# mending trickle (passive, while the gear is used). A coherent six-source loop.
id: "smithing"
max_level: 100
display: { name: "Smithing", icon: "minecraft:anvil", color: "YELLOW", style: "SEGMENTED_10" }
progression: { curve: "polynomial", base_xp: 50, exponent: 2.5 }
xp_sources:
  # Crafting tools/armor pays on the real material behind each craft.
  - trigger: "craft_item"
    filters: [ { target: "#c:tools" } ]
    reward: { constant: 64.1 }
  # Smelting metal ore is the forge grind, gated by fuel and smelt time.
  - trigger: "furnace_extract"
    filters: [ { target: "#minecraft:iron_ores" } ]
    reward: { constant: 64.1 }
  - trigger: "furnace_extract"
    filters: [ { target: "#minecraft:gold_ores" } ]
    reward: { constant: 64.1 }
  # Repairing a real repair at the anvil; gated by needing a damaged item.
  - trigger: "repair"
    reward: { constant: 64.1 }
  # Smithing-table work (netherite upgrades, trims) is scarce and high value.
  - trigger: "smith"
    reward: { constant: 80.0 }
  # Mending trickle while the player fights-and-wears covered gear.
  - trigger: "mend"
    reward: { constant: 30.0 }
abilities:
  # L1 - Foundational passive: the repair-economy identity scalar. Anvil repair
  # level cost scales down from level 1 so the whole climb is felt.
  - id: "efficient_repair"
    display_name: "Efficient Repair"
    unlock_level: 1
    trigger: "repair"
    display: { lore: [ "&7Anvil repair costs &a{discount}%&7 less." ] }
    mechanics:
      - type: "core:repair_discount"
        parameters:
          discount: { linear: { base: 2.0, step: 0.4, max: 40.0 } }
    feedback: { notify: { action_bar: false } }

  # L15 - QoL passive: crafted metal/mineral gear carries more max durability.
  # The boost lives on the item, so a smith's gear lasts longer in any hands.
  - id: "durable_craft"
    display_name: "Durable Craft"
    unlock_level: 15
    trigger: "craft_item"
    display: { lore: [ "&7Crafted metal gear has &a+{amount}&7 max durability." ] }
    mechanics:
      - type: "core:craft_durability"
        filters: [ { target: "#c:smithing" } ]
        parameters:
          amount: { linear: { base: 15.0, step: 1.0, max: 100.0 } }
    feedback: { notify: { action_bar: false } }

  # L25 - Primary active: the sharpen. Sneak + right-click a grindstone with a
  # tool held to hone its edge permanently. A stable uuid means re-sharpening
  # replaces - never stacks - and the bonus is a separate attribute so it stacks
  # with a Haste potion. Cost is hunger, not a cooldown.
  - id: "sharpen_edge"
    display_name: "Sharpen Edge"
    unlock_level: 25
    trigger: "right_click_block"
    display:
      lore:
        - "&7Sneak + interact a grindstone to sharpen"
        - "&7your held tool: +&a{amount}&7 mining efficiency."
        - "&7Costs 1 hunger."
        - "&8Requires: Sneaking, tool in hand, 3+ hunger."
    requirements:
      state: [ "is_sneaking" ]
      items: [ { action: "possession", tag: "#c:tools", slot: "MAIN_HAND" } ]
      exhaustion: { amount: 1.0, minimum: 3.0 }
    on_failure:
      exhaustion: { action_bar: "&cToo hungry to forge an edge!" }
    mechanics:
      - type: "core:cancel_event"
        filters: [ { target: "#c:grindstones" } ]
      - type: "core:sharpen_tool"
        filters: [ { target: "#c:grindstones" } ]
        parameters:
          amount: { linear: { base: 2.0, step: 0.06, max: 8.0 } }
          uuid: { constant: "8f1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d" }
    feedback:
      notify: { action_bar: true, chat: false, message: "&e✦ Edge Honed! ✦" }
      sounds: [ { type: "minecraft:block.stone.pressure_plate.click_on", volume: 0.7, pitch: 1.4, target: "self" } ]

  # L50 - Major passive: salvage. Sneak + right-click an anvil with a worn metal
  # or mineral item to melt it back into its primary material. Value is level-
  # scaled product_count, the L50 economy spike reached the instant it unlocks.
