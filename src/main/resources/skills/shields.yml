id: "shields"
max_level: 100

display:
  name: "Shields"
  icon: "minecraft:shield"
  color: "BLUE"
  style: "SOLID"

progression:
  curve: "polynomial"
  base_xp: 50
  exponent: 2.5

xp_sources:
  - trigger: "entity_damage_taken"
    filters:
      - state: "is_blocking"
    reward:
      constant: 5.0

abilities:
  - id: "sturdy_guard"
    display_name: "Sturdy Guard"
    unlock_level: 1
    display:
      lore:
        - "&a{chance}% &7chance to block damage while guarding."
    mechanics:
      - type: "core:block_damage"
        filters:
          - state: "is_blocking"
        parameters:
          chance:
            linear:
              base: 10.0
              step: 0.2
              max: 30.0
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "shield_bash"
    display_name: "Shield Bash"
    unlock_level: 15
    display:
      lore:
        - "&7Attackers take &a{damage} &7damage."
    mechanics:
      - type: "core:thorns_damage"
        filters:
          - state: "is_blocking"
        parameters:
          damage:
            linear:
              base: 1.0
              step: 0.02
              max: 4.0
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "wall_of_steel"
    display_name: "Wall of Steel"
    unlock_level: 25
    display:
      lore:
        - "&7Gain &a{amount} &7knockback resistance while blocking."
    mechanics:
      - type: "core:knockback_resist"
        filters:
          - state: "is_blocking"
        parameters:
          amount:
            linear:
              base: 0.1
              step: 0.003
              max: 0.5
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "shield_slam"
    display_name: "Shield Slam"
    unlock_level: 50
    display:
      lore:
        - "&a{chance}% &7chance to negate damage entirely."
    mechanics:
      - type: "core:cancel_damage"
        filters:
          - state: "is_blocking"
        parameters:
          chance:
            linear:
              base: 5.0
              step: 0.2
              max: 25.0
    feedback:
      notify:
        action_bar: false

  - id: "protective_aura"
    display_name: "Protective Aura"
    unlock_level: 75
    display:
      lore:
        - "&7Gain &a{amount} &7armor while blocking."
    mechanics:
      - type: "core:armor_bonus"
        filters:
          - state: "is_blocking"
        parameters:
          amount:
            linear:
              base: 0.0
              step: 0.01
              max: 1.0
    feedback:
      notify:
        action_bar: false

  - id: "indomitable"
    display_name: "Indomitable"
    unlock_level: 100
    display:
      lore:
        - "&7Near-perfect block chance and thorns."
    mechanics:
      - type: "core:block_damage"
        filters:
          - state: "is_blocking"
        parameters:
          chance:
            constant: 50.0
      - type: "core:thorns_damage"
        filters:
          - state: "is_blocking"
        parameters:
          damage:
            constant: 5.0
    feedback:
      notify:
        action_bar: false
