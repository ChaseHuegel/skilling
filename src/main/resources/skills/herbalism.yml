id: "herbalism"
max_level: 100

display:
  name: "Herbalism"
  icon: "minecraft:sugar_cane"
  color: "GREEN"
  style: "SEGMENTED_10"

progression:
  curve: "polynomial"
  base_xp: 50
  exponent: 2.5

xp_sources:
  - trigger: "block_break"
    filters:
      - target: "#c:herbs"
      - state: "player_placed:false"
    reward:
      constant: 4.0

  - trigger: "crop_grow"
    reward:
      constant: 2.0

abilities:
  - id: "green_thumb"
    display_name: "Green Thumb"
    unlock_level: 1
    display:
      lore:
        - "&7Increases herb and flower yield by &a{yield_chance}%&7."
    mechanics:
      - type: "core:yield_multiplier"
        filters:
          - target: "#c:herbs"
        parameters:
          yield_chance:
            linear:
              base: 0.5
              step: 0.5
              max: 50.0
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "rapid_growth"
    display_name: "Rapid Growth"
    unlock_level: 15
    display:
      lore:
        - "&7Harvest herbs &a{amplifier}x &7faster."
    mechanics:
      - type: "core:haste_effect"
        filters:
          - target: "#c:herbs"
        parameters:
          amplifier:
            linear:
              base: 1
              step: 0.005
              max: 2
          duration:
            constant: 300.0
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "herbalist_knowledge"
    display_name: "Herbalist Knowledge"
    unlock_level: 25
    display:
      lore:
        - "&7Gain bonus XP from harvesting herbs."
    mechanics:
      - type: "core:xp_bonus"
        parameters:
          multiplier:
            linear:
              base: 1.5
              step: 0.015
              max: 3.0
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "natural_remedy"
    display_name: "Natural Remedy"
    unlock_level: 50
    display:
      lore:
        - "&7Consuming herbs and flowers gives &a{saturation} extra saturation."
    mechanics:
      - type: "core:saturation_inject"
        parameters:
          saturation:
            linear:
              base: 1.0
              step: 0.02
              max: 3.0
    feedback:
      notify:
        action_bar: false

  - id: "overgrowth"
    display_name: "Overgrowth"
    unlock_level: 75
    display:
      lore:
        - "&7Sneak to harvest all nearby herbs at once."
    requirements:
      cooldown: 20.0
      state:
        - "is_sneaking"
      exhaustion:
        amount: 2.0
        minimum: 4.0
    on_failure:
      cooldown:
        action_bar: "&2Overgrowth cooling down: {time}s"
        sounds:
          - type: "BLOCK_NOTE_BLOCK_BASS"
            volume: 1.0
            pitch: 0.5
      exhaustion:
        action_bar: "&cToo exhausted for Overgrowth!"
    mechanics:
      - type: "core:area_harvest"
        filters:
          - target: "#c:herbs"
        parameters:
          radius:
            linear:
              base: 3.0
              step: 0.05
              max: 6.0
          max_blocks:
            constant: 16.0
    feedback:
      notify:
        action_bar: true
        chat: false
        message: "&2✦ Overgrowth! ✦"
      particles:
        - type: "BLOCK_CRACK"
          count: 20
          offset: [1.0, 0.5, 1.0]
          speed: 0.1
          target: "target"
      sounds:
        - type: "BLOCK_GRASS_BREAK"
          volume: 0.5
          pitch: 1.2
          target: "self"

  - id: "master_herbalist"
    display_name: "Master Herbalist"
    unlock_level: 100
    display:
      lore:
        - "&7Guaranteed double herb and flower drops."
    mechanics:
      - type: "core:yield_multiplier"
        filters:
          - target: "#c:herbs"
        parameters:
          yield_chance:
            constant: 100.0
    feedback:
      notify:
        action_bar: false
