# ==========================================
# HERBALISM SKILL — The Wild Forager
# ==========================================
# Gather and process wild flora: flowers, berries, vines, cane, cactus, fungi
# and roots. Cleanly disjoint from Farming (cultivated crops), Cooking (eating
# crafted meals) and Alchemy (nether wart -> potions). All gathering stays on
# player_placed:false so it is true foraging, never a place+break farm loop.
#
# Abilities (6-tier ladder, all sub-scaled):
#   L1   Green Thumb     yield scalar on wild herbs (identity)
#   L15  Hidden Bounty    break forage to reveal a common loot table (Hylian Luck)
#   L25  Earth Charm      sneak + right-click soil with a catalyst to convert it
#   L50  Flower Press     herb-product crafts yield more (economy spike)
#   L75  Rare Bloom       break rare herbs to reveal a rare loot table
#   L100 Master Forager   wild-herb breaks always double, sometimes triple
id: "herbalism"
max_level: 100
display: { name: "Herbalism", icon: "minecraft:sugar_cane", color: "GREEN", style: "SEGMENTED_10" }
progression: { curve: "polynomial", base_xp: 50, exponent: 2.5 }
xp_sources:
  # Wild gathering is the primary grind; player_placed excludes farmed loops.
  - trigger: "block_break"
    filters: [ { target: "#c:herbs" }, { state: "player_placed:false" } ]
    reward: { constant: 30.9 }
  # Scarce wild finds pay a premium over common flowers (plenty-and-value rule).
  - trigger: "block_break"
    filters: [ { target: "#c:rare_herbs" }, { state: "player_placed:false" } ]
    reward: { constant: 55.0 }
  # Herb products (paper, sugar, cactus green, flower dyes) are cheap & bulk -> low return.
  - trigger: "craft_item"
    filters: [ { target: "#c:herb_products" } ]
    reward: { constant: 18.0 }
  # Bonemeal on wild herbs is a real resource cost.
  - trigger: "fertilize"
    reward: { constant: 30.0 }
  # Eating wild herbs costs the item.
  - trigger: "consume_item"
    filters: [ { target: "#c:edible_herbs" } ]
    reward: { constant: 20.0 }
abilities:
  # L1 - Foundational passive: the primary scalar. Wild herb breaks double.
  - id: "green_thumb"
    display_name: "Green Thumb"
    unlock_level: 1
    trigger: "block_break"
    display: { lore: [ "&7Wild herb yield +&a{yield_chance}%&7." ] }
    mechanics:
      - type: "core:yield_multiplier"
        filters: [ { target: "#c:herbs" } ]
        parameters:
          yield_chance: { linear: { base: 0.5, step: 0.5, max: 50.0 } }
    feedback: { notify: { action_bar: false } }
  # L15 - Hidden Bounty (Hylian Luck): breaking forage reveals common treasure.
  # Low chance that grows with level; a miss still counts as an activation so it
  # cannot be re-rolled for free (proc-aware core:drop_loot).
  - id: "hidden_bounty"
    display_name: "Hidden Bounty"
    unlock_level: 15
    trigger: "block_break"
    display: { lore: [ "&7Breaking forage has a &a{chance}%&7 chance to reveal" ] }
    mechanics:
      - type: "core:drop_loot"
        filters: [ { target: "#c:forage" } ]
        parameters:
          table: { constant: "skilling:forage/common" }
          chance: { linear: { base: 2.0, step: 0.03, max: 5.0 } }
    feedback: { notify: { action_bar: false } }
  # L25 - Earth Charm: turn spreadable soil into fertile ground. Sneak +
  # right-click dirt or netherrack with a catalyst; the matching entry consumes
  # its catalyst and converts the block. Entries whose catalyst is not held are
  # no-ops that spend nothing.
  - id: "earth_charm"
    display_name: "Earth Charm"
    unlock_level: 25
    trigger: "right_click_block"
    display:
      lore:
        - "&7Sneak + interact soil with a catalyst to convert it."
        - "&7Seeds: &6dirt&8 -> &agrass"
        - "&7Mushroom: &6dirt&8 -> &7mycelium"
        - "&7Leaf litter: &6dirt&8 -> &2podzol"
        - "&7Crimson fungus: &6dirt/netherrack&8 -> &cnylium"
        - "&7Warped fungus: &6dirt/netherrack&8 -> &3nylium"
        - "&7Costs 1 catalyst + 1 hunger."
        - "&8Requires: Sneaking, 8s cooldown, 3+ hunger."
    requirements:
      cooldown: 8.0
      state: [ "is_sneaking" ]
      exhaustion: { amount: 1.0, minimum: 3.0 }
    on_failure:
      cooldown: { action_bar: "&aEarth Charm cooling down: {time}s" }
      exhaustion: { action_bar: "&cToo hungry to charm the earth!" }
    mechanics:
      - type: "core:block_transform"
        filters: [ { target: "#c:herbal_soil" } ]
        parameters:
          catalyst: { constant: "minecraft:wheat_seeds" }
          result: { constant: "minecraft:grass_block" }
          catalyst_count: { constant: 1 }
      - type: "core:block_transform"
        filters: [ { target: "#c:herbal_soil" } ]
        parameters:
          catalyst: { constant: "minecraft:brown_mushroom" }
          result: { constant: "minecraft:mycelium" }
          catalyst_count: { constant: 1 }
      - type: "core:block_transform"
        filters: [ { target: "#c:herbal_soil" } ]
        parameters:
          catalyst: { constant: "minecraft:leaf_litter" }
          result: { constant: "minecraft:podzol" }
          catalyst_count: { constant: 1 }
      - type: "core:block_transform"
        filters: [ { target: "#c:herbal_soil" } ]
        parameters:
          catalyst: { constant: "minecraft:crimson_fungus" }
          result: { constant: "minecraft:crimson_nylium" }
          catalyst_count: { constant: 1 }
      - type: "core:block_transform"
        filters: [ { target: "#c:herbal_soil" } ]
        parameters:
          catalyst: { constant: "minecraft:warped_fungus" }
          result: { constant: "minecraft:warped_nylium" }
          catalyst_count: { constant: 1 }
    feedback:
      notify: { action_bar: true, chat: false, message: "&2✦ Earth Charm ✦" }
      sounds: [ { type: "minecraft:block.grass.break", volume: 0.5, pitch: 1.2, target: "self" } ]
  # L50 - Major passive: the herb-product economy spike. Cheap craft loop yields
  # more, so the forager's dye/paper/bone-meal loop compounds.
  - id: "flower_press"
    display_name: "Flower Press"
    unlock_level: 50
    trigger: "craft_item"
    display: { lore: [ "&7Herb-product crafts yield &a{multiplier}x&7." ] }
    mechanics:
      - type: "core:modify_craft_output"
        filters: [ { target: "#c:herb_products" } ]
        parameters:
          multiplier: { linear: { base: 1.05, step: 0.0096, max: 2.0 } }
    feedback: { notify: { action_bar: false } }
  # L75 - Rare Bloom: breaking rare wild flora reveals a premium loot table.
  # Lower proc than Hidden Bounty so premium harvests stay genuinely rare.
  - id: "rare_bloom"
    display_name: "Rare Bloom"
    unlock_level: 75
    trigger: "block_break"
    display: { lore: [ "&7Breaking rare flora has a &a{chance}%&7 chance to reveal" ] }
    mechanics:
      - type: "core:drop_loot"
        filters: [ { target: "#c:rare_herbs" } ]
        parameters:
          table: { constant: "skilling:forage/rare" }
          chance: { linear: { base: 0.75, step: 0.02, max: 2.5 } }
    feedback: { notify: { action_bar: false } }
  # L100 - Mastery capstone: wild-herb breaks always double, sometimes triple.
  - id: "master_forager"
    display_name: "Master Forager"
    unlock_level: 100
    trigger: "block_break"
    display: { lore: [ "&7Wild herb breaks always double; &a{triple_chance}%&7 chance to triple." ] }
    mechanics:
      - type: "core:yield_multiplier"
        filters: [ { target: "#c:herbs" } ]
        parameters:
          yield_chance: { constant: 100.0 }
          triple_chance: { linear: { base: 10.0, step: 0.9, max: 80.0 } }
    feedback: { notify: { action_bar: false } }