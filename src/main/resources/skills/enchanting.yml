id: "enchanting"
max_level: 100
display: { name: "Enchanting", icon: "minecraft:enchanting_table", color: "PURPLE", style: "SEGMENTED_10" }
progression: { curve: "polynomial", base_xp: 50, exponent: 2.5 }
xp_sources:
  # The core act: each table enchantment pays in levels and lapis, so it is a
  # genuinely gated, skill-specific source.
  - trigger: "enchant_item"
    reward: { constant: 64.1 }
  # Mending turns XP orbs into repair, so it feeds the skill while consuming its
  # own resource (the orbs) — a grindable, real-cost source.
  - trigger: "mend"
    reward: { constant: 30.0 }
  # Anvil repairs cost materials and levels. Gated by the engine to fire only on
  # a materialized repair (result present with a level cost), never on GUI opens.
  - trigger: "repair"
    reward: { constant: 64.1 }
  # Librarian enchanted books are the vanilla book economy; buying them costs
  # emeralds. Trade-skill overlaps stay in the trade skill's abilities; this is
  # only an XP source keyed to enchanted books specifically.
  - trigger: "trade"
    filters: [ { target: "minecraft:enchanted_book" } ]
    reward: { constant: 90.0 }
  # Fishing is a slow, time-gated grind that also yields enchanted treasure.
  - trigger: "fishing"
    reward: { constant: 35.0 }
abilities:
  # L1 identity scalar: the enchanting "yield" — a chance at an extra enchantment,
  # mirroring alchemy's Overbrew and the other skills' primary scalar.
  - id: "bonus_enchant"
    display_name: "Bonus Enchant"
    unlock_level: 1
    trigger: "enchant_item"
    display: { lore: [ "&7Enchanting grants a &a{chance}%&7 chance of an extra enchantment." ] }
    mechanics:
      - type: "core:bonus_enchant"
        parameters:
          chance: { linear: { base: 5.0, step: 0.45, max: 50.0 } }
    feedback: { notify: { action_bar: false } }
  # L15 QoL: the table's own level economy. Distinct from smithing (forge/anvil)
  # and trade (villager commerce).
  - id: "efficient_enchanting"
    display_name: "Efficient Enchanting"
    unlock_level: 15
    trigger: "enchant_item"
    display: { lore: [ "&7Enchanting costs &a{discount}%&7 fewer levels." ] }
    mechanics:
      - type: "core:modify_enchant_cost"
        parameters:
          discount: { linear: { base: 5.0, step: 0.25, max: 30.0 } }
    feedback: { notify: { action_bar: false } }
  # L25 active: grindstone extraction without a cooldown, balanced by cost. The
  # stripped enchant de-powers the item (forcing a re-enchant), plus hunger, a
  # book, and flat durability are all consumed. Sneak + interact extracts and
  # suppresses the vanilla GUI; a normal interact keeps the vanilla grindstone.
  - id: "enchant_extraction"
    display_name: "Enchant Extraction"
    unlock_level: 25
    trigger: "right_click_block"
    display:
      lore:
        - "&7Sneak + interact a grindstone to strip one enchantment into an enchanted book."
        - "&7Costs 2 hunger + 1 book + up to &a30&7 durability."
        - "&8Requires: Sneaking, enchanted item in hand, 4+ hunger."
    requirements:
      state: [ "is_sneaking" ]
      items:
        - { action: "possession", tag: "#c:enchantable", slot: "MAIN_HAND", enchanted: true }
        - { action: "cost", tag: "minecraft:book", amount: 1 }
      exhaustion: { amount: 2.0, minimum: 4.0 }
      durability:
        amount: { linear: { base: 30.0, step: -0.2, max: 10.0 } }
        slot: "MAIN_HAND"
    on_failure:
      missing_item: { action_bar: "&cRequires an enchanted item + 1 Book." }
      exhaustion: { action_bar: "&cToo hungry to extract." }
    mechanics:
      - type: "core:extract_enchant"
        filters: [ { target: "minecraft:grindstone" } ]
    feedback:
      notify: { action_bar: true, chat: false, message: "&d✦ Enchantment Extracted! ✦" }
      particles: [ { type: "minecraft:enchant", count: 12, offset: [0.5,0.5,0.5], speed: 0.5, target: "target" } ]
      sounds: [ { type: "minecraft:block.amethyst_block.chime", volume: 0.6, pitch: 1.2, target: "self" } ]
  # L50 Soul Bound: a chance to keep the entire inventory on death. Whole-inventory
  # roll (one per death), sub-scaled from the unlock level. Event-only, so it is
  # uninstall-safe, and it no-ops on servers that already keep inventory.
  - id: "soul_bound"
    display_name: "Soul Bound"
    unlock_level: 50
    trigger: "player_death"
    display: { lore: [ "&7&a{chance}%&7 chance to keep your entire inventory on death." ] }
    mechanics:
      - type: "core:keep_on_death"
        parameters:
          chance: { linear: { base: 5.0, step: 0.5, max: 30.0 } }
    feedback: { notify: { chat: true, message: "&d✦ Soul Bound held your items! ✦" } }
  # L75 major passive: enchants apply at a chance to hit +1 level, capped at the
  # vanilla max. Purely enchanting, no smithing/trade overlap, meaningful when
  # players are min-maxing final-tier enchants.
  - id: "empowered_enchants"
    display_name: "Empowered Enchants"
    unlock_level: 75
    trigger: "enchant_item"
    display: { lore: [ "&7Chosen enchants have a &a{chance}%&7 chance to apply +1 level." ] }
    mechanics:
      - type: "core:enchant_level_up"
        parameters:
          chance: { linear: { base: 15.0, step: 0.7, max: 50.0 } }
    feedback: { notify: { action_bar: false } }
  # L100 capstone: every enchantment is guaranteed an extra random enchantment.
  # Binary, mirroring alchemy's Masters' Brew; at this level Bonus Enchant's roll
  # can also land for a possible second extra.
  - id: "perfect_enchanting"
    display_name: "Perfect Enchanting"
    unlock_level: 100
    trigger: "enchant_item"
    display: { lore: [ "&7Every enchantment gains an extra random enchantment." ] }
    mechanics:
      - type: "core:bonus_enchant"
        parameters:
          chance: { constant: 100.0 }
    feedback: { notify: { action_bar: false } }
