id: "heavy_armor"
max_level: 100
display: { name: "Heavy Armor", icon: "minecraft:diamond_chestplate", color: "BLUE", style: "SOLID" }
progression: { curve: "polynomial", base_xp: 50, exponent: 2.5 }
xp_sources:
  - trigger: "entity_damage_taken"
    filters: [ { state: "equipped_all:#c:heavy_armor" } ]
    reward: { constant: 20.8 }      # per raw damage point (5 ≈ 2.5-heart hit). Damage-scaled
    scaling: damage
  - trigger: "entity_kill"
    filters: [ { state: "equipped_all:#c:heavy_armor" } ]
    reward: { constant: 114.9 }     # grindable combat: kill while armored
  - trigger: "craft_item"
    filters: [ { target: "#c:heavy_armor" } ]
    reward: { constant: 104.2 }
  # Outlier per REPORT_XP-SOURCE-DESIGN §2: tanking skills exceed the ~60/action ceiling.
abilities:
  # -- FOUNDATIONAL (L1): the primary scalar. Always-on armor while armored.
  # Generic armor points scale across the whole range; the bonus only lives while
  # the player actually wears a full heavy-armor set (core:equipment_attribute).
  - id: "vanguard"
    display_name: "Vanguard"
    unlock_level: 1
    trigger: "level_up"
    display: { lore: [ "&7While in heavy armor: +&a{amount}&7 armor." ] }
    mechanics:
      - type: "core:equipment_attribute"
        parameters:
          attribute: { constant: "minecraft:armor" }
          amount: { linear: { base: 1.0, step: 0.07, max: 8.0 } }
          uuid: { constant: "7b24cdbd-a100-5976-8d7b-a8a39f69e3e7" }
          equip_tag: { constant: "#c:heavy_armor" }
    feedback: { notify: { action_bar: false } }
  # -- QoL PASSIVE (L15): armor toughness — the netherite signature stat — made
  # into the mastery's ever-growing big-hit shredding, while wearing heavy armor.
  - id: "juggernaut"
    display_name: "Juggernaut"
    unlock_level: 15
    trigger: "level_up"
    display: { lore: [ "&7While in heavy armor: +&a{amount}&7 armor toughness." ] }
    mechanics:
      - type: "core:equipment_attribute"
        parameters:
          attribute: { constant: "minecraft:armor_toughness" }
          amount: { linear: { base: 2.0, step: 0.08, max: 10.0 } }
          uuid: { constant: "603af789-2b86-50e0-ab73-3e3d984c284f" }
          equip_tag: { constant: "#c:heavy_armor" }
    feedback: { notify: { action_bar: false } }
  # -- PRIMARY HOOK (L25): plant your feet. Sneaking in heavy armor grants full
  # knockback resistance, so a crowd cannot shove you once the first blow lands.
  - id: "rooted"
    display_name: "Rooted"
    unlock_level: 25
    trigger: "entity_damage_taken"
    display: { lore: [ "&7Sneak in heavy armor: immune to knockback for &a{duration}s&7 on hit." ] }
    mechanics:
      - type: "core:knockback_resist"
        filters: [ { state: "is_sneaking" }, { state: "equipped_all:#c:heavy_armor" } ]
        parameters:
          amount: { constant: 1.0 }
          uuid: { constant: "2f8c5d3e-1b4a-4a6f-8e7d-0c9d3e2f1a4b" }
          duration: { linear: { base: 4.0, step: 0.04, max: 6.0 } }
    feedback: { notify: { action_bar: false } }
  # -- MAJOR PASSIVE (L50): short-lived regeneration under pressure. Getting hit
  # in heavy armor grants a brief regen window, keeping the tank in the fight.
  - id: "second_wind"
    display_name: "Second Wind"
    unlock_level: 50
    trigger: "entity_damage_taken"
    display: { lore: [ "&7Hit in heavy armor grants Regeneration for &a{duration}s&7." ] }
    mechanics:
      - type: "core:apply_status"
        filters: [ { state: "equipped_all:#c:heavy_armor" } ]
        parameters:
          effect: { constant: "minecraft:regeneration" }
          duration: { linear: { base: 3.0, step: 0.04, max: 6.0 } }
          amplifier: { constant: 0.0 }
    feedback: { notify: { action_bar: false } }
  # -- SYNERGY PASSIVE (L75): walk through anything. In heavy armor, blunt the
  # full environmental hazard set — fire, lava, drowning, suffocation, cactus,
  # explosions. The walking-fortress fantasy made real.
  - id: "walking_fortress"
    display_name: "Walking Fortress"
    unlock_level: 75
    trigger: "entity_damage_taken"
    display: { lore: [ "&7In heavy armor take &a{reduction}%&7 less environmental damage (fire, lava, drowning, suffocation, cactus, explosions)." ] }
    mechanics:
      - type: "core:reduce_damage"
        filters: [ { state: "equipped_all:#c:heavy_armor" }, { state: "cause:environmental" } ]
        parameters:
          reduction: { linear: { base: 20.0, step: 0.4, max: 50.0 } }
    feedback: { notify: { action_bar: false } }
  # -- MASTERY CAPSTONE (L100): armor incarnate. In heavy armor, soften every
  # incoming blow, melee and projectile alike — the final tier of the tank.
  - id: "iron_mountain"
    display_name: "Iron Mountain"
    unlock_level: 100
    trigger: "entity_damage_taken"
    display: { lore: [ "&7In heavy armor reduce all incoming damage by &a{reduction}%&7." ] }
    mechanics:
      - type: "core:reduce_damage"
        filters: [ { state: "equipped_all:#c:heavy_armor" } ]
        parameters:
          reduction: { linear: { base: 10.0, step: 0.18, max: 25.0 } }
    feedback: { notify: { action_bar: false } }