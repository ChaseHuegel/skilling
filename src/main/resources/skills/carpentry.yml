  # -- MASTERY CAPSTONE (L100): the mobile workshop. Holding a crafted wooden
  # product and right-clicking air opens a full crafting grid anywhere, so the
  # master carpenter works wherever the timber is. Gated by an item in hand and
  # the hunger cost; the item's inventory cooldown (from core:set_cooldown) shows
  # the wait in the slot UI instead of a chat-based timer.
  - id: "mobile_workbench"
    display_name: "Mobile Workbench"
    unlock_level: 100
    trigger: "right_click_air"
    display:
      lore:
        - "&7Right-click with a wooden product to open"
        - "&7a crafting grid anywhere."
        - "&7Costs 1 hunger."
        - "&8Requires: wooden product in hand, 3+ hunger."
    requirements:
      items: [ { action: "possession", tag: "#c:wooden_products", slot: "MAIN_HAND" } ]
      exhaustion: { amount: 1.0, minimum: 3.0 }
    on_failure:
      exhaustion: { action_bar: "&cToo hungry to work!" }
    mechanics:
      - type: "core:open_crafting"
      - type: "core:set_cooldown"
        parameters:
          material: { constant: "minecraft:crafting_table" }
          ticks: { constant: 100.0 }
    feedback:
      notify: { action_bar: true, chat: false, message: "&e✦ Mobile Workbench ✦" }
      sounds: [ { type: "minecraft:block.wood.step", volume: 0.5, pitch: 1.2, target: "self" } ]
