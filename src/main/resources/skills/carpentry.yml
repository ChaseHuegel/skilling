id: "carpentry"
max_level: 100

display:
  name: "Carpentry"
  icon: "minecraft:crafting_table"
  color: "YELLOW"
  style: "SEGMENTED_10"

progression:
  curve: "polynomial"
  base_xp: 50
  exponent: 2.5

xp_sources:
  - trigger: "craft_item"
    reward:
      constant: 8.0

  - trigger: "block_break"
    filters:
      - target: "#minecraft:logs"
      - state: "player_placed:false"
    reward:
      constant: 2.0

abilities:
  - id: "efficient_crafting"
    display_name: "Efficient Crafting"
    unlock_level: 1
    trigger: "craft_item"
    display:
      lore:
        - "&7Increases output when crafting wooden items."
    mechanics:
      - type: "core:modify_craft_output"
        parameters:
          multiplier:
            linear:
              base: 1.0
              step: 0.005
              max: 1.5
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "precise_cut"
    display_name: "Precise Cut"
    unlock_level: 15
    trigger: "item_damage"
    display:
      lore:
        - "&7Tools last &a{chance}% &7longer."
    mechanics:
      - type: "core:durability_save"
        parameters:
          chance:
            linear:
              base: 15.0
              step: 0.4
              max: 60.0
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "timber_reclaim"
    display_name: "Timber Reclaim"
    unlock_level: 25
    trigger: "block_break"
    display:
      lore:
        - "&7Chance to double logs when breaking trees."
    mechanics:
      - type: "core:yield_multiplier"
        filters:
          - target: "#minecraft:logs"
          - tool: "#minecraft:axes"
        parameters:
          yield_chance:
            linear:
              base: 5.0
              step: 0.3
              max: 35.0
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "wood_weave"
    display_name: "Wood Weave"
    unlock_level: 50
    trigger: "craft_item"
    display:
      lore:
        - "&7Bonus output when crafting fences, gates, and trapdoors."
    mechanics:
      - type: "core:modify_craft_output"
        parameters:
          multiplier:
            linear:
              base: 1.0
              step: 0.01
              max: 2.0
    feedback:
      notify:
        action_bar: false

  - id: "iron_bark_touch"
    display_name: "Iron Bark Touch"
    unlock_level: 75
    trigger: "block_break"
    display:
      lore:
        - "&7Gain &a{amount} &7armor while holding an axe."
    mechanics:
      - type: "core:armor_bonus"
        filters:
          - tool: "#minecraft:axes"
        parameters:
          amount:
            linear:
              base: 0.0
              step: 0.01
              max: 1.0
    feedback:
      notify:
        action_bar: false

  - id: "master_joiner"
    display_name: "Master Joiner"
    unlock_level: 100
    trigger: "craft_item"
    display:
      lore:
        - "&7Doubles output when crafting any wooden item."
    mechanics:
      - type: "core:modify_craft_output"
        parameters:
          multiplier:
            constant: 2.0
    feedback:
      notify:
        action_bar: false
