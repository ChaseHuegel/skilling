# ==========================================
# CARPENTRY SKILL — The Woodworker
# ==========================================
# Woodcutting harvests raw logs; Building places blocks. Carpentry transforms
# timber into joinery products — the craft of the woodworker. Its loop turns
# planks and logs into furniture and fittings, fletches arrows, feeds the kiln,
# and finally masters both the stonecutter saw and a mobile workshop.
#
# Abilities (6-tier ladder, all sub-scaled except the sanctioned binary unlock):
#   L1   Joinery         craft output multiplier on wooden products (identity scalar)
#   L15  Fletcher        craft output multiplier on all arrows
#   L25  Fine Grain      axes chance to lose no durability
#   L50  Charcoal Kiln   bonus charcoal from the furnace
#   L75  Mate Saw        unlock stonecutter wood-cutting recipes (data pack)
#   L100 Mobile Workbench  open a crafting grid anywhere
#
# XP loop: crafting planks (cheap, bulk -> low return), crafting premium wood
# joinery (real material cost -> higher), and placing joinery. Deliberately no
# log-breaking source: that is woodcutting's grind, not a carpenter's.
id: "carpentry"
max_level: 100
display: { name: "Carpentry", icon: "minecraft:crafting_table", color: "YELLOW", style: "SEGMENTED_10" }
progression: { curve: "polynomial", base_xp: 50, exponent: 2.5 }
xp_sources:
  # Planks are the cheapest, most spammable craft, so this returns low (bulk = minor).
  - trigger: "craft_item"
    filters: [ { target: "#minecraft:planks" } ]
    reward: { constant: 15.0 }
  # Premium joinery costs real materials (chests, barrels, tables, boats), so it pays higher.
  - trigger: "craft_item"
    filters: [ { target: "#c:carpentry_joinery" } ]
    reward: { constant: 40.0 }
  # Placing joinery is a placement loop distinct from Building's raw-plank placement.
  - trigger: "block_place"
    filters: [ { target: "#c:carpentry_joinery" } ]
    reward: { constant: 30.0 }
abilities:
  # -- FOUNDATIONAL (L1): the primary scalar. Wood product crafts yield more,
  # growing from level 1 so the whole climb is felt. Cap raised to 2x at 100.
  - id: "joinery"
    display_name: "Joinery"
    unlock_level: 1
    trigger: "craft_item"
    display: { lore: [ "&7Wooden product crafts yield &a{multiplier}x&7." ] }
    mechanics:
      - type: "core:modify_craft_output"
        filters: [ { target: "#c:wooden_products" } ]
        parameters:
          multiplier: { linear: { base: 1.05, step: 0.0096, max: 2.0 } }
    feedback: { notify: { action_bar: false } }

  # -- QOL PASSIVE (L15): fletching. All arrows (regular, tipped, spectral)
  # craft in greater number, easing the ammo economy.
  - id: "fletcher"
    display_name: "Fletcher"
    unlock_level: 15
    trigger: "craft_item"
    display: { lore: [ "&7Arrow crafts yield &a{multiplier}x&7." ] }
    mechanics:
      - type: "core:modify_craft_output"
        filters: [ { target: "#minecraft:arrows" } ]
        parameters:
          multiplier: { linear: { base: 1.1, step: 0.0059, max: 1.6 } }
    feedback: { notify: { action_bar: false } }

  # -- QOL PASSIVE (L25): fine grain. Careful workmanship keeps axes sharp
  # longer, so the carpenter's primary tool lasts between workshops.
  - id: "fine_grain"
    display_name: "Fine Grain"
    unlock_level: 25
    trigger: "item_damage"
    display: { lore: [ "&7Axes have &a{chance}%&7 chance to lose no durability." ] }
    mechanics:
      - type: "core:durability_save"
        filters: [ { tool: "#minecraft:axes" } ]
        parameters:
          chance: { linear: { base: 15.0, step: 0.4667, max: 50.0 } }
    feedback: { notify: { action_bar: false } }

  # -- MAJOR PASSIVE (L50): the kiln. Logs char into more charcoal, fuelling the
  # furnace loop mid-game with a level-scaled economy spike.
  - id: "charcoal_kiln"
    display_name: "Charcoal Kiln"
    unlock_level: 50
    trigger: "furnace_extract"
    display: { lore: [ "&7Charcoal output &a{multiplier}x&7." ] }
    mechanics:
      - type: "core:modify_furnace_output"
        filters: [ { target: "minecraft:charcoal" } ]
        parameters:
          multiplier: { linear: { base: 1.1, step: 0.018, max: 2.0 } }
    feedback: { notify: { action_bar: false } }

  # -- SYNERGY PASSIVE (L75): the mate saw. Learning to run the stonecutter as
  # a wood saw permanently unlocks the bundled wood-cutting recipes (logs and
  # planks into slabs, stairs, fences, gates, trapdoors, and doors). A binary,
  # one-time unlock: the sanctioned exception to the no-static-milestones rule.
  # The data pack lives at plugins/Skilling/datapacks/carpentry.zip and ships
  # inside the plugin jar.
  - id: "mate_saw"
    display_name: "Mate Saw"
    unlock_level: 75
    trigger: "level_up"
    display:
      lore:
        - "&7Learn to cut wood in the stonecutter:"
        - "&7logs become planks; planks become boards."
