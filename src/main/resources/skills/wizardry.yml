id: "wizardry"
max_level: 100

display:
  name: "Wizardry"
  icon: "minecraft:ender_pearl"
  color: "PURPLE"
  style: "SEGMENTED_10"

progression:
  curve: "polynomial"
  base_xp: 50
  exponent: 2.5

xp_sources:
  - trigger: "collect_xp"
    reward:
      constant: 2.0

  - trigger: "player_interact"
    reward:
      constant: 1.0

abilities:
  - id: "arcane_missile"
    display_name: "Arcane Missile"
    unlock_level: 1
    display:
      lore:
        - "&7Launches arcane projectiles dealing &a{damage} &7damage."
    mechanics:
      - type: "core:projectile"
        parameters:
          speed:
            constant: 2.0
          damage:
            linear:
              base: 2.0
              step: 0.02
              max: 5.0
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "blink"
    display_name: "Blink"
    unlock_level: 15
    display:
      lore:
        - "&7Short-range teleport of &a{range} &7blocks."
    mechanics:
      - type: "core:teleport"
        parameters:
          range:
            linear:
              base: 5.0
              step: 0.05
              max: 10.0
    feedback:
      notify:
        action_bar: true
        chat: false
        message: "&d✦ Blink! ✦"
      particles:
        - type: "PORTAL"
          count: 15
          offset: [0.5, 0.5, 0.5]
          speed: 0.5
          target: "self"
      sounds:
        - type: "ENTITY_ENDERMAN_TELEPORT"
          volume: 0.5
          pitch: 1.5
          target: "self"

  - id: "mana_shield"
    display_name: "Mana Shield"
    unlock_level: 25
    display:
      lore:
        - "&7Gain &a{amount} &7armor from arcane energy."
    mechanics:
      - type: "core:armor_bonus"
        parameters:
          amount:
            linear:
              base: 0.0
              step: 0.005
              max: 0.5
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "arcane_expertise"
    display_name: "Arcane Expertise"
    unlock_level: 50
    display:
      lore:
        - "&7Gain bonus XP from arcane activities."
    mechanics:
      - type: "core:xp_bonus"
        parameters:
          multiplier:
            linear:
              base: 1.5
              step: 0.015
              max: 3.0
    feedback:
      notify:
        action_bar: false

  - id: "frost_nova"
    display_name: "Frost Nova"
    unlock_level: 75
    display:
      lore:
        - "&7Damaging enemies slows nearby foes."
    mechanics:
      - type: "core:crowd_control"
        parameters:
          effect:
            constant: 2.0
          radius:
            linear:
              base: 3.0
              step: 0.04
              max: 6.0
          duration:
            constant: 4.0
          amplifier:
            constant: 1.0
    feedback:
      notify:
        action_bar: true
        chat: false
        message: "&b✦ Frost Nova! ✦"
      particles:
        - type: "SNOWBALL"
          count: 20
          offset: [1.0, 0.5, 1.0]
          speed: 0.5
          target: "target"
      sounds:
        - type: "ENTITY_SNOW_GOLEM_SHOOT"
          volume: 0.5
          pitch: 0.8
          target: "self"

  - id: "archmage"
    display_name: "Archmage"
    unlock_level: 100
    display:
      lore:
        - "&7Powerful arcane projectiles and shield."
    mechanics:
      - type: "core:projectile"
        parameters:
          speed:
            constant: 3.0
          damage:
            constant: 10.0
      - type: "core:armor_bonus"
        parameters:
          amount:
            constant: 0.5
    feedback:
      notify:
        action_bar: false
