id: "fishing"
max_level: 100

display:
  name: "Fishing"
  icon: "minecraft:fishing_rod"
  color: "GREEN"
  style: "SEGMENTED_10"

progression:
  curve: "polynomial"
  base_xp: 50
  exponent: 2.5

xp_sources:
  - trigger: "fishing"
    reward:
      constant: 138.9
  - trigger: "craft_item"
    filters:
      - target: "#c:fishing_rods"
    reward:
      constant: 138.9
  # Treasure-catch source deferred (the fishing trigger fires once per caught
  # fish via the CAUGHT_FISH state gate, but treasure is a loot-table subset of
  # that catch, not a distinct event). Two sources used.
  # Outlier per REPORT_XP-SOURCE-DESIGN §2: R=139 exceeds the ~60/action ceiling.

abilities:
  - id: "angler"
    display_name: "Angler"
    unlock_level: 1
    trigger: "fishing"
    display:
      lore:
        - "&7Increases treasure catch rate by &a{yield_chance}%&7."
    mechanics:
      - type: "core:fishing_yield"
        parameters:
          yield_chance:
            linear:
              base: 1.0
              step: 0.015
              max: 2.5
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "light_line"
    display_name: "Light Line"
    unlock_level: 15
    trigger: "item_damage"
    display:
      lore:
        - "&7Fishing rods have &a{chance}%&7 chance to lose no durability."
    mechanics:
      - type: "core:durability_save"
        filters:
          - target: "minecraft:fishing_rod"
        parameters:
          chance:
            linear:
              base: 20.0
              step: 0.5
              max: 75.0
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "lucky_catch"
    display_name: "Lucky Catch"
    unlock_level: 25
    trigger: "fishing"
    display:
      lore:
        - "&7Better enchantments and loot from fishing treasure."
    mechanics:
      - type: "core:fishing_yield"
        parameters:
          yield_chance:
            linear:
              base: 1.0
              step: 0.02
              max: 2.0
    feedback:
      notify:
        action_bar: true
        chat: false
        message: "&b✦ Lucky Catch! ✦"
      sounds:
        - type: "minecraft:entity.player.levelup"
          volume: 0.5
          pitch: 1.5
          target: "self"

  - id: "sea_bounty"
    display_name: "Sea Bounty"
    unlock_level: 50
    trigger: "fishing"
    display:
      lore:
        - "&7Fish catches yield &a{multiplier}x&7."
    mechanics:
      - type: "core:fishing_loot"
        parameters:
          multiplier:
            linear:
              base: 2.0
              step: 0.01
              max: 2.5
    feedback:
      notify:
        action_bar: false

  - id: "tidal_resilience"
    display_name: "Tidal Resilience"
    unlock_level: 75
    trigger: "fishing"
    display:
      lore:
        - "&7Gain knockback resistance while fishing."
    mechanics:
      - type: "core:knockback_resist"
        filters:
          - tool: "#c:fishing_rods"
        parameters:
          amount:
            linear:
              base: 0.2
              step: 0.005
              max: 0.7
          uuid: { constant: "91b24164-6939-55f0-8afe-4f08f6ca825a" }
    feedback:
      notify:
        action_bar: false

  - id: "leviathan"
    display_name: "Leviathan"
    unlock_level: 100
    trigger: "fishing"
    display:
      lore:
        - "&7Guaranteed max-size catches and rare treasure."
    mechanics:
      - type: "core:fishing_loot"
        parameters:
          multiplier:
            constant: 3.0
    feedback:
      notify:
        action_bar: false
