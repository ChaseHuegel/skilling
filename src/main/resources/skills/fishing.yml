id: "fishing"
max_level: 100

display:
  name: "Fishing"
  icon: "minecraft:fishing_rod"
  color: "GREEN"
  style: "SEGMENTED_10"

progression:
  curve: "polynomial"
  base_xp: 50
  exponent: 2.5

# Fishing is a relaxed, methodical skill: one neat catch is the reward, never a
# single game-ending jackpot. Only one ability (Favored Waters) multiplies the
# quantity of a catch; the rest shorten the wait, shift catch quality, reward
# dedicated weather, or ease landing a hooked mob. Every source and ability here
# is a passive — no durability savings, no combat damage, no cooldowns, no
# item-cost actives (except Plump Bait, which consumes an offhand bait per catch,
# turning a relaxed supply loop into a gentle material sink).
xp_sources:
  # Casting and catching is the primary grind: naturally time-gated, so a
  # moderate reward (~60/action, within the design ceiling) keeps it honest.
  - trigger: "fishing"
    reward:
      constant: 60.0
  # A fishing rod is a cheap, bulk-craftable material (3 sticks + 2 string), so
  # its source returns low value per craft.
  - trigger: "craft_item"
    filters:
      - target: "#c:fishing_rods"
    reward:
      constant: 15.0
  # Eating your catch is a non-free, non-bulkable source: you must spend the fish
  # to gain the XP, tying the skill's grind into the cooking loop.
  - trigger: "consume_item"
    filters:
      - target: "#c:fish"
    reward:
      constant: 10.0

abilities:
  - id: "angler"
    display_name: "Angler"
    unlock_level: 1
    trigger: "fishing_cast"
    display:
      lore:
        - "&7Your line bites &a{reduction}%&7 faster."
    mechanics:
      - type: "core:fishing_speed"
        parameters:
          reduction:
            linear:
              base: 20.0
              step: 0.4
              max: 60.0
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "favored_waters"
    display_name: "Favored Waters"
    unlock_level: 15
    trigger: "fishing"
    display:
      lore:
        - "&7In the open ocean, catches yield &a{multiplier}x&7."
    mechanics:
      - type: "core:fishing_loot"
        filters:
          - state: "biome:minecraft:ocean"
        parameters:
          multiplier:
            linear:
              base: 1.2
              step: 0.004
              max: 1.6
    feedback:
      notify:
        action_bar: false

  - id: "plump_bait"
    display_name: "Plump Bait"
    unlock_level: 25
    trigger: "fishing"
    display:
      lore:
        - "&7Bait in the offhand lures better catches, &a{chance}%&7 of the time."
        - "&7Costs 1 bait."
    requirements:
      items:
        - action: "possession"
          tag: "#c:bait_common"
          slot: "OFF_HAND"
        - action: "cost"
          tag: "#c:bait_common"
          slot: "OFF_HAND"
          amount: 1
    mechanics:
      - type: "core:drop_loot"
        filters:
          - state: "offhand:#c:bait_common"
        parameters:
          table:
            constant: "skilling:fishing/bait"
          chance:
            linear:
              base: 20.0
              step: 0.3
              max: 50.0
    feedback:
      notify:
        action_bar: false

  - id: "boat_hauler"
    display_name: "Boat Hauler"
    unlock_level: 50
    trigger: "fishing"
    display:
      lore:
        - "&7While riding a boat, &a{yield_chance}%&7 chance for a bonus catch."
    mechanics:
      - type: "core:fishing_yield"
        filters:
          - state: "is_riding"
        parameters:
          yield_chance:
            linear:
              base: 20.0
              step: 0.3
              max: 50.0
    feedback:
      notify:
        action_bar: false

  - id: "grappling_hook"
    display_name: "Grappling Hook"
    unlock_level: 75
    trigger: "fishing_hook"
    display:
      lore:
        - "&7Hooking a mob slows it for easy reeling."
    mechanics:
      - type: "core:apply_status"
        parameters:
          effect:
            constant: "minecraft:slowness"
          duration:
            linear:
              base: 4.0
              step: 0.04
              max: 8.0
          amplifier:
            constant: 1.0
    feedback:
      notify:
        action_bar: false

  - id: "master_angler"
    display_name: "Master Angler"
    unlock_level: 100
    trigger: "fishing"
    display:
      lore:
        - "&7A long, patient catch sometimes rolls a rare reward, &a{chance}%&7."
    mechanics:
      - type: "core:drop_loot"
        parameters:
          table:
            constant: "skilling:fishing/master"
          chance:
            linear:
              base: 10.0
              step: 0.3
              max: 40.0
    feedback:
      notify:
        action_bar: true
        chat: false
        message: "&b✦ A rare catch! ✦"
      sounds:
        - type: "minecraft:entity.player.levelup"
          volume: 0.5
          pitch: 1.5
          target: "self"