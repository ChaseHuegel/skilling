id: "riding"
max_level: 100

display:
  name: "Riding"
  icon: "minecraft:saddle"
  color: "WHITE"
  style: "SOLID"

progression:
  curve: "polynomial"
  base_xp: 50
  exponent: 2.5

xp_sources:
  - trigger: "ride_horse"
    reward:
      constant: 25.0

  - trigger: "entity_damage"
    filters:
      - state: "is_riding"
    reward:
      constant: 5.0

abilities:
  - id: "mounted_combat_training"
    display_name: "Mounted Combat Training"
    unlock_level: 1
    trigger: "entity_damage"
    display:
      lore:
        - "&7Increases damage by &a{multiplier}x &7while mounted."
    mechanics:
      - type: "core:modify_damage"
        filters:
          - state: "is_riding"
        parameters:
          multiplier:
            linear:
              base: 1.05
              step: 0.004
              max: 1.35
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "swift_mount"
    display_name: "Swift Mount"
    unlock_level: 15
    trigger: "ride_horse"
    display:
      lore:
        - "&7Move &a{multiplier}x &7faster while riding."
    mechanics:
      - type: "core:speed_bonus"
        filters:
          - state: "is_riding"
        parameters:
          multiplier:
            linear:
              base: 1.05
              step: 0.002
              max: 1.25
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "mounted_defense"
    display_name: "Mounted Defense"
    unlock_level: 25
    trigger: "entity_damage_taken"
    display:
      lore:
        - "&a{chance}% &7chance to dodge attacks while riding."
    mechanics:
      - type: "core:dodge"
        filters:
          - state: "is_riding"
        parameters:
          chance:
            linear:
              base: 5.0
              step: 0.2
              max: 25.0
    feedback:
      notify:
        action_bar: false
        chat: false

  - id: "calvary_charge"
    display_name: "Calvary Charge"
    unlock_level: 50
    trigger: "entity_damage"
    display:
      lore:
        - "&7Attacks slow targets while mounted."
    mechanics:
      - type: "core:apply_status"
        filters:
          - state: "is_riding"
        parameters:
          effect:
            constant: 2.0
          duration:
            linear:
              base: 2.0
              step: 0.03
              max: 5.0
          amplifier:
            constant: 1.0
    feedback:
      notify:
        action_bar: false

  - id: "horse_mastery"
    display_name: "Horse Mastery"
    unlock_level: 75
    trigger: "ride_horse"
    display:
      lore:
        - "&7Gain &a{amount} &7armor while riding."
    mechanics:
      - type: "core:armor_bonus"
        filters:
          - state: "is_riding"
        parameters:
          amount:
            linear:
              base: 0.0
              step: 0.01
              max: 1.0
    feedback:
      notify:
        action_bar: false

  - id: "legendary_rider"
    display_name: "Legendary Rider"
    unlock_level: 100
    trigger: "entity_damage"
    display:
      lore:
        - "&7Massive mounted damage and speed boost."
    mechanics:
      - type: "core:modify_damage"
        filters:
          - state: "is_riding"
        parameters:
          multiplier:
            constant: 2.0
      - type: "core:speed_bonus"
        filters:
          - state: "is_riding"
        parameters:
          multiplier:
            constant: 1.3
    feedback:
      notify:
        action_bar: false
