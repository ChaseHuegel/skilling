# ==========================================
# EXPLORATION SKILL
# ==========================================
# The travel and scavenging skill. It earns XP from filling and working with
# maps, cartography, looting containers, opening trial vaults, and discovering
# recipes, and turns travel into a weak, consistent speed buff: exploring new
# land (L1 Pathfinder) grows into a strong travel surge when a map fills
# (L100 True North). Mark the Trail (L25) shares the speed with nearby allies.
#
# XP loop: fill maps, use the cartography table, open loot containers and trial
# vaults, and unlock new crafting recipes. chunk_load XP stays with Survival;
# here chunk_load is an ability trigger only.
id: "exploration"
max_level: 100
display: { name: "Exploration", icon: "minecraft:map", color: "BLUE", style: "SEGMENTED_10" }
progression: { curve: "polynomial", base_xp: 50, exponent: 2.5 }
xp_sources:
  - trigger: "map_fill"
    reward: { constant: 40.0 }
  - trigger: "cartography"
    reward: { constant: 60.0 }
  - trigger: "loot"
    reward: { constant: 60.0 }
  - trigger: "vault_change"
    reward: { constant: 80.0 }
  - trigger: "recipe_discover"
    reward: { constant: 40.0 }
abilities:
  # -- FOUNDATIONAL (L1): the travel scalar. Exploring new land grants a weak
  # speed buff that becomes a consistent travel aid as its duration scales up.
  # Unlocks at level 0 (the starting level): exploring grants no exploration XP
  # (chunk_load XP stays with Survival), so a level-1 gate would lock the
  # skill's own foundational passive forever.
  - id: "pathfinder"
    display_name: "Pathfinder"
    unlock_level: 0
    trigger: "chunk_load"
    display: { lore: [ "&7Exploring new land grants &a{duration}s&7 of Speed (&a{multiplier}x&7)." ] }
    mechanics:
      - type: "core:speed_bonus"
        parameters:
          multiplier: { linear: { base: 1.10, step: 0.0015, max: 1.25 } }   # weak but noticeable, sub-scaling
          uuid: { constant: "8d96db25-38ce-5f64-a2ca-60a4bc6bcb4e" }
          duration: { linear: { base: 20.0, step: 1.0, max: 120.0 } }
    feedback:
      notify: { action_bar: true, chat: false, message: "&b✦ Pathfinder! ✦" }
      sounds: [ { type: "minecraft:entity.experience_orb.pickup", volume: 0.4, pitch: 1.6, target: "self" } ]

  # -- QOL PASSIVE (L15): cartography work feeds a short XP boost.
  - id: "cartographers_eye"
    display_name: "Cartographer's Eye"
    unlock_level: 15
    trigger: "cartography"
    display: { lore: [ "&7Cartography grants &a{multiplier}x&7 XP for {duration}s." ] }
    mechanics:
      - type: "core:xp_bonus"
        parameters:
          multiplier: { linear: { base: 1.1, step: 0.004, max: 1.5 } }
          duration: { constant: 30.0 }
    feedback: { notify: { action_bar: false } }

  # -- PRIMARY ABILITY (L25): the trail marker. Sneak + Right-Click with a
  # filled map to share a speed and leaping buff with nearby allies.
  - id: "mark_the_trail"
    display_name: "Mark the Trail"
    unlock_level: 25
    trigger: "right_click_air"
    display:
      lore:
        - "&7Sneak + Right-Click with a map: nearby allies gain Speed & Leaping for &a{duration}s&7 (radius &a{radius}&7)."
        - "&7Costs 1 hunger."
        - "&8Requires: Sneaking, map in hand, 30s cooldown, 3+ hunger."
    requirements:
      cooldown: { linear: { base: 30.0, step: -0.2, max: 15.0 } }
      state: [ "is_sneaking" ]
      items: [ { action: "possession", tag: "minecraft:filled_map", slot: "MAIN_HAND" } ]
      exhaustion: { amount: 1.0, minimum: 3.0 }
    on_failure:
      cooldown: { action_bar: "&eMark the Trail cooling down: {time}s" }
      missing_item: { action_bar: "&cRequires a filled map in hand!" }
      exhaustion: { action_bar: "&cToo exhausted to mark the trail!" }
    mechanics:
      - type: "core:field_aura"
        parameters:
          effect: { constant: "minecraft:speed" }
          radius: { linear: { base: 4.0, step: 0.08, max: 10.0 } }
          duration: { linear: { base: 10.0, step: 0.1, max: 20.0 } }
          amplifier: { constant: 0.0 }
      - type: "core:field_aura"
        parameters:
          effect: { constant: "minecraft:jump_boost" }
          radius: { linear: { base: 4.0, step: 0.08, max: 10.0 } }
          duration: { linear: { base: 10.0, step: 0.1, max: 20.0 } }
          amplifier: { constant: 0.0 }
    feedback:
      notify: { action_bar: true, chat: false, message: "&b✦ Mark the Trail! ✦" }
      sounds: [ { type: "minecraft:entity.experience_orb.pickup", volume: 0.5, pitch: 1.5, target: "self" } ]

  # -- MAJOR PASSIVE (L50): scavenging feeds a short XP boost.
  - id: "scavenger"
    display_name: "Scavenger"
    unlock_level: 50
    trigger: "loot"
    display: { lore: [ "&7Looting containers grants &a{multiplier}x&7 XP for {duration}s." ] }
    mechanics:
      - type: "core:xp_bonus"
        parameters:
          multiplier: { linear: { base: 1.15, step: 0.005, max: 1.65 } }
          duration: { constant: 30.0 }
    feedback: { notify: { action_bar: false } }

  # -- SYNERGY PASSIVE (L75): trial vaults wrap the raider in absorption,
  # mirroring Survival's Well Rested. Radius 0 keeps it a self-buff.
  - id: "vault_raider"
    display_name: "Vault Raider"
    unlock_level: 75
    trigger: "vault_change"
    display: { lore: [ "&7Opening a trial vault grants &a{duration}s&7 of Absorption." ] }
    mechanics:
      - type: "core:field_aura"
        parameters:
          effect: { constant: "minecraft:absorption" }
          radius: { constant: 0.0 }
          duration: { linear: { base: 30.0, step: 0.6, max: 90.0 } }
          amplifier: { linear: { base: 0.0, step: 0.02, max: 1.0 } }
    feedback: { notify: { action_bar: false } }

  # -- MASTERY CAPSTONE (L100): filling a map surges travel. A strong, long
  # speed buff plus a short jump boost.
  - id: "true_north"
    display_name: "True North"
    unlock_level: 100
    trigger: "map_fill"
    display: { lore: [ "&7Filling a map grants &a{duration}s&7 of strong Speed and a short jump boost." ] }
    mechanics:
      - type: "core:speed_bonus"
        parameters:
          multiplier: { linear: { base: 1.2, step: 0.002, max: 1.4 } }
          uuid: { constant: "7b8a70ad-69d4-5e80-83a2-2a8062a311dd" }
          duration: { linear: { base: 60.0, step: 1.2, max: 180.0 } }
      - type: "core:modify_jump"
        parameters:
          multiplier: { constant: 1.3 }
          uuid: { constant: "139567d4-3915-5d87-81ef-0a3be2232fb6" }
          duration: { constant: 15.0 }
    feedback: { notify: { action_bar: false } }
