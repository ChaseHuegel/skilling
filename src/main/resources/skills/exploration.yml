# ==========================================
# EXPLORATION SKILL
# ==========================================
# The travel and scavenging skill. It earns XP from filling maps, cartography,
# looting containers, opening trial vaults, and discovering recipes. Scavenging
# is the core scalar (L1): looting more as it levels. The compass is the travel
# signature: re-pointing one at a stronghold (L25 Wayfinder's Compass) and, at
# the capstone, recalling to the lodestone a bound compass points at (L100
# Lodestone Recall). Mapping new land feeds biome discovery (L15), looting vaults
# (L50), and elytra flight shreds collision damage (L75 Skyward).
#
# XP loop: carry a map into uncharted land (map_explore), finish maps
# (map_fill), use the cartography table, open loot containers and trial vaults,
# and unlock new recipes.
id: "exploration"
max_level: 100
display: { name: "Exploration", icon: "minecraft:map", color: "BLUE", style: "SEGMENTED_10" }
progression: { curve: "polynomial", base_xp: 50, exponent: 2.5 }
xp_sources:
  # Carrying a map into freshly generated terrain fills it. Dispatched once per
  # player per 5s (throttled with chunk_load), so a long mapping session is a
  # steady trickle rather than a flood. The endless, time-gated grindable.
  - trigger: "map_explore"
    reward: { constant: 18.0 }
  # Completing a map's first render is a rarer, one-time burst.
  - trigger: "map_fill"
    reward: { constant: 60.0 }
  # Cartography table work is material-costed (paper/glass/compass), so cloning
  # and expanding maps is a fair grindable source.
  - trigger: "cartography"
    reward: { constant: 50.0 }
  # Looting containers and trial-vault fills. Routed to nearby players.
  - trigger: "loot"
    reward: { constant: 50.0 }
  # Opening a trial vault. Heavily time-gated (per-player vault cooldowns).
  - trigger: "vault_change"
    reward: { constant: 80.0 }
  # Unlocking new recipes; a one-time-ish, low source.
  - trigger: "recipe_discover"
    reward: { constant: 40.0 }
abilities:
  # -- FOUNDATIONAL (L1): the core scalar. Scavenging looting more as it levels.
  # Most valuable early and mid game, when container loot is still exciting.
  - id: "scavenger"
    display_name: "Scavenger"
    unlock_level: 1
    trigger: "loot"
    display: { lore: [ "&7Looting grants a &a{chance}%&7 chance to pocket a bonus item." ] }
    mechanics:
      - type: "core:loot_bonus"
        parameters:
          chance: { linear: { base: 15.0, step: 0.45, max: 60.0 } }
    feedback: { notify: { action_bar: false } }

  # -- QOL PASSIVE (L15): biome discovery. Each distinct biome you map grants a
  # small permanent movement-speed bonus, capped. Growth comes from seeing the
  # world, which is still mostly undiscovered at this stage (no late backtracking).
  - id: "diverse_horizon"
    display_name: "Diverse Horizon"
    unlock_level: 15
    trigger: "map_explore"
    display:
      lore:
        - "&7Each distinct biome you map grants a small permanent speed boost"
        - "&7(max &a{max_biomes}&7 biomes)."
    mechanics:
      - type: "core:biome_discovery"
        parameters:
          attribute: { constant: "minecraft:movement_speed" }
          amount: { constant: 0.001 }
          max_biomes: { constant: 25.0 }
          uuid: { constant: "3a9c7e14-1b5d-4a6f-8c2e-6d9b0f1a4c87" }
    feedback: { notify: { action_bar: false } }

  # -- PRIMARY ABILITY (L25): the Wayfinder's Compass. Sneak + Right-Click a
  # compass to persistently re-point it at the nearest stronghold. No cost or
  # cooldown: the compass needle itself is the reward and the feedback.
  - id: "wayfinders_compass"
    display_name: "Wayfinder's Compass"
    unlock_level: 25
    trigger: "right_click_air"
    display:
      lore:
        - "&7Sneak + Right-Click a compass: it re-points to the nearest Stronghold."
        - "&8Requires: Sneaking, compass in hand."
    requirements:
      state: [ "is_sneaking" ]
      items: [ { action: "possession", tag: "minecraft:compass", slot: "MAIN_HAND" } ]
    on_failure:
      missing_item: { action_bar: "&cRequires a compass in hand!" }
    mechanics:
      - type: "core:locate"
        parameters:
          structure: { constant: "stronghold" }
    feedback:
      notify: { action_bar: true, chat: false, message: "&b✦ Wayfinder: Stronghold locked. ✦" }
      sounds: [ { type: "minecraft:block.amethyst_block.chime", volume: 0.5, pitch: 1.4, target: "self" } ]

  # -- MAJOR PASSIVE (L50): Vault Raider. Opening a trial vault has a chance to
  # dispense a bonus reward on top of the vanilla payout.
  - id: "vault_raider"
    display_name: "Vault Raider"
    unlock_level: 50
    trigger: "vault_change"
    display: { lore: [ "&7Opening a trial vault grants a &a{chance}%&7 chance of a bonus reward." ] }
    mechanics:
      - type: "core:vault_bonus"
        parameters:
          chance: { linear: { base: 30.0, step: 0.9, max: 75.0 } }
          table: { constant: "minecraft:chests/trial_chambers_reward" }
    feedback: { notify: { action_bar: false } }

  # -- SYNERGY PASSIVE (L75): Skyward. Elytra wall collisions are friction;
  # shred the damage as mastery grows, reaching full immunity at the cap.
  - id: "skyward"
    display_name: "Skyward"
    unlock_level: 75
    trigger: "entity_damage_taken"
    display: { lore: [ "&7&a{chance}%&7 chance to shrug off elytra wall-collision damage." ] }
    mechanics:
      - type: "core:cancel_damage"
        filters: [ { state: "cause:fly_into_wall" } ]
        parameters:
          chance: { linear: { base: 40.0, step: 2.4, max: 100.0 } }
    feedback:
      notify: { action_bar: false }
      sounds:
        - type: "minecraft:entity.phantom.flap"
          volume: 0.4
          pitch: 1.6
          target: "self"
      success_only: true

  # -- MASTERY CAPSTONE (L100): Lodestone Recall. A compass bound to a lodestone
  # you planted returns you there — recall to your own camp, on the compass's
  # vanilla item cooldown so it shows readiness in the slot UI.
  - id: "lodestone_recall"
    display_name: "Lodestone Recall"
    unlock_level: 100
    trigger: "right_click_air"
    display:
      lore:
        - "&7Sneak + Right-Click a lodestone compass: return to its lodestone."
        - "&7Costs 1 hunger."
        - "&8Requires: Sneaking, lodestone compass, 3+ hunger. Cooldown shown on the compass."
    requirements:
      state: [ "is_sneaking" ]
      items: [ { action: "possession", tag: "minecraft:compass", slot: "MAIN_HAND" } ]
      exhaustion: { amount: 1.0, minimum: 3.0 }
    on_failure:
      missing_item: { action_bar: "&cRequires a lodestone compass in hand!" }
      exhaustion: { action_bar: "&cToo exhausted to recall." }
    mechanics:
      - type: "core:teleport_lodestone"
        parameters:
          cooldown_ticks: { constant: 6000.0 }
    feedback:
      notify: { action_bar: true, chat: false, message: "&b✦ Recall! ✦" }
      sounds: [ { type: "minecraft:entity.ender_pearl.throw", volume: 0.6, pitch: 1.2, target: "self" } ]