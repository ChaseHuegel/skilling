# ==========================================
# Skilling — Global Configuration
# ==========================================

database:
  # Maximum number of connections in the HikariCP pool
  pool_size: 10
  # Use SQLite Write-Ahead Logging for concurrent reads/writes
  wal_mode: true

bossbar:
  # Maximum active Boss Bars visible on a player's screen at once (LRU eviction)
  max_active: 2
  # Tick duration for Boss Bar fade-out animation
  fade_ticks: 40

debouncer:
  # Minimum interval (ms) between repeated failure feedback messages per player-ability
  interval_ms: 500

# Enable verbose console logging for runtime troubleshooting
# WARNING: Will produce significant log output; use only for debugging
debug_logging: false

titles:
  # Duration (ms) for the main level-up title's stay phase before fade-out
  stay_duration: 5000

# Global XP multiplier applied to all XP gains. Default: 1.0
global_xp_modifier: 1.0

# Internal flag tracking whether bundled resources (skills, tags, templates)
# have been written to disk. Set to false by the plugin after first-run setup.
# Do not modify manually unless you want bundled files regenerated.
setup:
  first_run: true

# Crop grow trigger configuration
crop_grow:
  # Radius (in blocks) to search for nearby players when a crop grows naturally
  search_radius: 10

# Skills Guide Book — a craftable item that opens the skill menu on right-click
# Recipe: book + compass = enchanted book
skills_guide_book:
  enabled: true

# Web-based administration interface
# Disabled by default. Enable only if you need the browser GUI.
# WARNING: Credentials are sent in plaintext via Basic auth over HTTP. Use a
# reverse proxy (nginx, Caddy) for TLS in production, or set bind_address to
# "127.0.0.1" to restrict the GUI to this machine. This is a local admin tool
# for trusted networks only.
web:
  # Enable the web server
  enabled: false
  # Port to listen on (use a port > 1024 on Linux)
  port: 8082
  # Address to bind. "0.0.0.0" listens on all interfaces; "127.0.0.1" restricts
  # the GUI to this machine only (recommended without a reverse proxy).
  bind_address: "0.0.0.0"
  # Basic authentication credentials
  username: "admin"
  # The shipped default is replaced by a generated random password (logged to
  # console) the first time the web GUI is enabled. Do not leave it as the
  # known default "skilling".
  password: "skilling"
