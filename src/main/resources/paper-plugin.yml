name: Skilling
version: ${version}
main: io.github.chasehuegel.skilling.Skilling
api-version: '1.21'
authors: [ChaseHuegel]
description: A high-performance, data-driven RPG skills engine for PaperMC
website: https://github.com/chasehuegel/skilling

softdepend:
  - PlaceholderAPI
  - Vault

permissions:
  skilling.admin:
    description: Access to administrative /skills commands
    default: op
  skilling.use:
    description: Open the player skill overview and use player-facing /skills commands
    default: true
