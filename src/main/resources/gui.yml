# ============================================================================
# Skills GUI Layout Configuration
# ============================================================================
# Defines how skills are organized into pages and placed in the chest grid.
# If this file is missing or empty, the plugin falls back to the default
# flat sequential layout (current behavior).
#
# Each page renders as a chest inventory. Navigation arrows and the page
# indicator icon are automatically placed on the last row.
#   - First column of last row: Previous-page arrow (auto-rendered)
#   - Center column of last row: Page indicator icon
#   - Last column of last row: Next-page arrow (auto-rendered)
# - All unassigned slots show filler (configurable below).
#
# Titles support Minecraft formatting codes (&0-&f, &l, &o, &n, &m, &k, &r).
# ============================================================================

