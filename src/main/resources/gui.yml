# ============================================================================
# Skills GUI Layout Configuration
# ============================================================================
# Defines how skills are organized into pages and placed in the chest grid.
# If this file is missing or empty, the plugin falls back to the default
# flat sequential layout (current behavior).
#
# Each page renders as a full 54-slot chest inventory (6 rows x 9 columns).
# - Slots 0-44 and 46-48, 50-52 are valid for skill placement.
# - Slot 45 is reserved for the previous-page arrow (auto-rendered).
# - Slot 49 is reserved for the page indicator icon.
# - Slot 53 is reserved for the next-page arrow (auto-rendered).
# - All unassigned slots show filler glass (BLACK_STAINED_GLASS_PANE by default).
# ============================================================================

