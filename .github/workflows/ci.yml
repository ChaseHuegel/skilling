name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: web/frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('web/frontend/package-lock.json') }}

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: web/frontend
        run: npx vue-tsc --noEmit

      - name: Build frontend
        working-directory: web/frontend
        run: npm run build

      # build runs the tests; no separate ./gradlew test step.
      - name: Build plugin with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/

      - name: Upload shadow JAR
        uses: actions/upload-artifact@v4
        with:
          name: skilling-jar
          path: build/libs/skilling-*.jar
